# Ver 2026-07-31, by Sonnet 5 — vmr config for load testing (docs/VirtualModelRouter_Design_v4_Core.md §12).
# Not the same as config.yaml/config.example.yaml at the repo root — this points
# at loadtest/mockupstream, never a real provider, and listens on a different
# port so it can run alongside a real dev instance without clashing.
#
# Updated to the flat providers/models schema (commit "Flatten providers to a
# multi-protocol list...") — this file was missed in that migration and had
# gone stale (go run ./loadtest/runner failed to parse it) until this pass.

listen: 127.0.0.1:8801
max_concurrency: 0          # unlimited — we want to see vmr's natural ceiling, not an artificial gate
log_dir: ./logs/loadtest    # own subdirectory under logs/ — separate from ~/.vmr/logs and from
                            # any real vmr instance's logs/*.jsonl (runner.go wipes this dir clean
                            # before every run; must never point at a shared/real log directory)
audit_retention_days: 0     # keep forever; this is a small, throwaway log directory anyway
image_cache_dir: ./logs/loadtest/image_cache  # own subdirectory, same reasoning as log_dir above —
                            # runner.go wipes this clean before every run too. Without this it would
                            # default to the same ~/.vmr/image_cache a real vmr instance uses, and
                            # since gentargets' cache-busting variants are deterministic (same seeds
                            # every run, no true randomness), every run after the first would find
                            # its own "fresh" variants already warm from the previous run — quietly
                            # defeating the whole point of generating them.

providers:
  # mockupstream speaks all three protocols on the same account (it just
  # echoes back whatever shape the request came in as) — one flat-schema
  # entry covers what used to be separate providers.openai.mock /
  # providers.anthropic.mock declarations.
  - name: mock
    base_url: {openai: http://127.0.0.1:9900/v1, anthropic: http://127.0.0.1:9900/v1, openai-responses: http://127.0.0.1:9900/v1}
    api_key: sk-loadtest-mock-key
  - name: mock_fail1
    base_url: {openai: http://127.0.0.1:9900/fail1/v1}   # loadtest/mockupstream always answers 500 on this path
    api_key: sk-loadtest-mock-key
  - name: mock_fail2
    base_url: {openai: http://127.0.0.1:9900/fail2/v1}   # same, second failing endpoint for the failover scenario
    api_key: sk-loadtest-mock-key
  - name: mock_ok
    base_url: {openai: http://127.0.0.1:9900/ok/v1}      # succeeds — the failover scenario's third, winning endpoint
    api_key: sk-loadtest-mock-key

# One virtual model per scenario in docs/VirtualModelRouter_Design_v4_Core.md §12 —
# doubles as the scenario label in `vmr report`'s per-model breakdown.
models:
  baseline:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:baseline"]}]
  stream_normal:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:stream_normal"]}]
  thinking_leak:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:thinking_leak"]}]
  think_tag:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:think_tag"]}]
  big_response:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:big_response"]}]
  big_image:
    image_downscale: 512    # per-model override — global image_downscale stays off for every other scenario
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:baseline"]}]
  multi_image:
    image_downscale: 512
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:baseline"]}]
  gif:
    image_downscale: 512    # on, specifically to confirm GIF still skips the decode path even when downscaling is enabled
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:baseline"]}]
  long_history:
    endpoints: [{protocol: openai, provider: mock, models: ["scenario:baseline"]}]
  failover:
    endpoints:
      - {protocol: openai, provider: mock_fail1, models: ["scenario:baseline"], priority: 1}
      - {protocol: openai, provider: mock_fail2, models: ["scenario:baseline"], priority: 2}
      - {protocol: openai, provider: mock_ok, models: ["scenario:baseline"], priority: 3}
  anthropic_baseline:
    endpoints: [{protocol: anthropic, provider: mock, models: ["scenario:baseline"]}]
  responses_baseline:
    endpoints: [{protocol: openai-responses, provider: mock, models: ["scenario:baseline"]}]
