# Ver 2026-07-16 00:00, by Sonnet 5 — vmr config for load testing (docs/PerformanceTesting_Design_Sonnet5.md).
# Not the same as config.yaml/config.example.yaml at the repo root — this points
# at loadtest/mockupstream, never a real provider, and listens on a different
# port so it can run alongside a real dev instance without clashing.

listen: 127.0.0.1:8801
max_concurrency: 0          # unlimited — we want to see vmr's natural ceiling, not an artificial gate
log_dir: ./loadtest/logs    # kept separate from the normal ~/.vmr/logs
audit_retention_days: 0     # keep forever; this is a small, throwaway log directory anyway

providers:
  openai:
    mock:
      base_url: http://127.0.0.1:9900
      api_key: sk-loadtest-mock-key
    mock_fail1:
      base_url: http://127.0.0.1:9900/fail1   # loadtest/mockupstream always answers 500 on this path
      api_key: sk-loadtest-mock-key
    mock_fail2:
      base_url: http://127.0.0.1:9900/fail2   # same, second failing endpoint for the failover scenario
      api_key: sk-loadtest-mock-key
    mock_ok:
      base_url: http://127.0.0.1:9900/ok      # succeeds — the failover scenario's third, winning endpoint
      api_key: sk-loadtest-mock-key
  anthropic:
    mock:
      base_url: http://127.0.0.1:9900
      api_key: sk-loadtest-mock-key

models:
  openai:
    # One virtual model per scenario in docs/PerformanceTesting_Design_Sonnet5.md §4 —
    # doubles as the scenario label in `vmr report`'s per-model breakdown.
    baseline:
      endpoints: [{provider: mock, model: "scenario:baseline"}]
    stream_normal:
      endpoints: [{provider: mock, model: "scenario:stream_normal"}]
    thinking_leak:
      endpoints: [{provider: mock, model: "scenario:thinking_leak"}]
    think_tag:
      endpoints: [{provider: mock, model: "scenario:think_tag"}]
    big_response:
      endpoints: [{provider: mock, model: "scenario:big_response"}]
    big_image:
      image_downscale: 512    # per-model override — global image_downscale stays off for every other scenario
      endpoints: [{provider: mock, model: "scenario:baseline"}]
    multi_image:
      image_downscale: 512
      endpoints: [{provider: mock, model: "scenario:baseline"}]
    gif:
      image_downscale: 512    # on, specifically to confirm GIF still skips the decode path even when downscaling is enabled
      endpoints: [{provider: mock, model: "scenario:baseline"}]
    long_history:
      endpoints: [{provider: mock, model: "scenario:baseline"}]
    failover:
      endpoints:
        - {provider: mock_fail1, model: "scenario:baseline", priority: 1}
        - {provider: mock_fail2, model: "scenario:baseline", priority: 2}
        - {provider: mock_ok, model: "scenario:baseline", priority: 3}
  anthropic:
    anthropic_baseline:
      endpoints: [{provider: mock, model: "scenario:baseline"}]
