<!DOCTYPE html>
<!-- Ver 2026-09-14, by pi — console-unification Log page (real /log stream) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMR Console — Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23161b22%22/><path d=%22M8 8l8 13 8-13%22 fill=%22none%22 stroke=%22%2358a6ff%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<style>
/*{{CONSOLE_CSS}}*/

/* ===== Log-page private styles (terminal chrome; not shared with other pages) ===== */
.w230{width:230px}

/* The Log page owns its own scrolling: body is a flex column, header and
   footer are fixed-size, main fills the rest and scrolls internally. */
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* connection-error banner — a separate, named element distinct from the
   jump-to-bottom chip. Reconnect lives here and nowhere else. */
#conn-banner{
  display:none;align-items:center;gap:10px;
  padding:8px 16px;
  background:var(--red-bg);border-bottom:1px solid rgba(248,81,73,.35);
  color:var(--red);font-size:var(--fs-sm);
  flex-shrink:0;
}
#conn-banner.show{display:flex}
#conn-banner .spacer{flex:1}

/* terminal viewport */
main.term{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
pre#log{
  flex:1;overflow-y:auto;margin:0;padding:12px 16px 20px;
  font-family:var(--font-mono);font-size:var(--fs-sm);line-height:1.2;
  white-space:pre-wrap;word-break:break-all;
}

/* log line structural classes */
.ln{display:block;line-height:1.2;font-family:var(--font-mono)}
.ln .t{color:var(--text-dim)}
.ln .lv{font-weight:600}
.ln.inf .lv{color:var(--accent)}
.ln.ok  .lv{color:var(--green)}
.ln.wrn .lv{color:var(--yellow)}
.ln.err .lv{color:var(--red)}
.ln.err{background:rgba(248,81,73,.06)}
.ln.wrn{background:rgba(210,153,34,.05)}
.ln .m{color:var(--text)}
.ln mark{background:rgba(210,153,34,.35);color:var(--text-bright);border-radius:2px}
.empty{color:var(--text-muted);padding:18px 0;font-family:var(--font-sans)}

/* jump-to-bottom chip — one meaning: scroll to the bottom and resume autoscroll.
   Reconnect is in #conn-banner, never here. */
#jump{
  position:absolute;right:22px;bottom:18px;
  display:none;align-items:center;gap:6px;
  background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-pill);
  padding:5px 13px;font:600 var(--fs-sm) var(--font-sans);cursor:pointer;
  box-shadow:0 6px 20px rgba(1,4,9,.5);
}
#jump.show{display:inline-flex}

/* level filter chips in the rail (console.css has .lvl-group/.lvl-label/.lvl) */
.rail-sep{width:1px;height:16px;background:var(--border);margin:0 6px;align-self:center;flex-shrink:0}
.lvl-group{display:inline-flex;gap:4px;align-items:center}
.lvl-label{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-muted);margin-right:2px}
.lvl{font-family:var(--font-mono);font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);cursor:pointer}
.lvl.on{color:var(--text-bright)}
.lvl[data-lvl=ERR].on{background:var(--red-bg);color:var(--red);border-color:rgba(248,81,73,.4)}
.lvl[data-lvl=WRN].on{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(210,153,34,.4)}
.lvl[data-lvl=OK].on{background:var(--green-bg);color:var(--green);border-color:rgba(63,185,80,.4)}
.lvl[data-lvl=INF].on{background:var(--accent-bg);color:var(--accent);border-color:rgba(88,166,255,.4)}
</style>
</head>
<body>

<!-- mountConsole injects header (rows 1+2), footer, and shared modals.
     The rail content below is appended by the page script after mount. -->

<!-- disconnection banner: stands alone, separate from the jump chip -->
<div id="conn-banner">
  <span>Log stream disconnected.</span>
  <span class="spacer"></span>
  <button class="btn sm" id="btn-retry">⟳ Reconnect</button>
</div>

<main class="term">
  <pre id="log"></pre>
  <button id="jump">↓ <span id="jump-n">0</span> new</button>
</main>

<script>
/*{{CONSOLE_JS}}*/

/* ===== Log page runtime ===== */

/* Ring buffer cap — kept at 512 to match the server-side logtee default.
   The buffer is the source-of-truth for filtering and Copy view. */
const BUFFER = 512;

/* Heuristic log-level classification.
   Real log lines from vmr carry no structured level field — they are plain
   Go log text. We classify by keyword inspection so level chips are useful,
   but this is *display-only*: the same line may match differently if the
   format ever changes. See console-unification §8.6 task description. */
function classifyLevel(text) {
  // ERR: explicit error= key, panic, or HTTP 5xx class marker
  if (/\berror=|\bpanic\b|class=.*5[0-9][0-9]/.test(text)) return 'ERR';
  // WRN: cooldown or stale signals
  if (/\bcooldown\b|\bstale\b|\btransient\b/.test(text)) return 'WRN';
  // OK: explicit ok / success signals
  if (/\bOK\b|\bhealthy\b|\bcache hit\b/.test(text)) return 'OK';
  return 'INF';
}

/* DOM refs */
const logEl    = document.getElementById('log');
const jumpEl   = document.getElementById('jump');
const jumpNEl  = document.getElementById('jump-n');
const bannerEl = document.getElementById('conn-banner');

/* State */
let allLines       = [];   // {t: timestamp-prefix|'', lv: 'ERR'|'WRN'|'OK'|'INF', raw: string}
let autoscroll     = true;
let newSinceScroll = 0;
let paused         = false;  // rendering paused; stream keeps running
let filterEl       = null;   // wired after rail is built
const levels       = { ERR: true, WRN: true, OK: true, INF: true };

/* mountConsole — inject header, footer, modals */
const con = mountConsole({
  active: 'log',
  rail: [],          // Log page toolbar is injected inline below, not as section anchors
  refresh: 'stream',
});

/* Build the page toolbar (rail row 2) inline.
   mountConsole leaves the #hd-rail-inner element; we populate it here.
   The spacer is already appended by mountConsole for full-bleed pages. */
const railEl = document.getElementById('hd-rail-inner');
railEl.insertAdjacentHTML('afterbegin', `
  <span class="lvl-group">
    <span class="lvl-label">Level:</span>
    <button class="lvl on" data-lvl="ERR">ERR</button>
    <button class="lvl on" data-lvl="WRN">WRN</button>
    <button class="lvl on" data-lvl="OK">OK</button>
    <button class="lvl on" data-lvl="INF">INF</button>
  </span>
  <span class="rail-sep"></span>
  <input class="input w230" id="filter" placeholder="keyword filter" autocomplete="off">
  <button class="btn sm ghost" id="btn-clear-filter" title="Clear keyword filter and reset level chips">Clear</button>
  <span class="rail-sep"></span>
  <button class="btn sm" id="btn-pause" title="Pause rendering (⌘P / Ctrl+P)">⏸ Pause</button>
  <span class="rail-sep"></span>
  <button class="btn sm ghost" id="btn-copy" title="Copy visible lines to clipboard">Copy</button>
`);

filterEl = document.getElementById('filter');

/* ---- filter / level helpers ---- */

function passes(o) {
  if (!levels[o.lv]) return false;
  const f = filterEl ? filterEl.value.trim().toLowerCase() : '';
  return !f || o.raw.toLowerCase().includes(f);
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

/* Highlight the filter substring within already-escaped HTML. */
function markup(text) {
  const f = filterEl ? filterEl.value.trim() : '';
  const safe = esc(text);
  if (!f) return safe;
  const needle = esc(f).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(needle, 'gi'), m => '<mark>' + m + '</mark>');
}

function appendLine(o) {
  const cls = { INF: 'inf', OK: 'ok', WRN: 'wrn', ERR: 'err' }[o.lv] || 'inf';
  const tPart = o.t ? `<span class="t">${esc(o.t)}</span> ` : '';
  const html = `<span class="ln ${cls}">${tPart}<span class="lv">${o.lv}</span> <span class="m">${markup(o.raw)}</span></span>\n`;
  const atBottom = autoscroll && (logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8);
  logEl.insertAdjacentHTML('beforeend', html);
  // trim DOM to BUFFER+8 to avoid unbounded growth during long sessions
  while (logEl.children.length > BUFFER + 8) logEl.firstChild.remove();
  if (atBottom) {
    logEl.scrollTop = logEl.scrollHeight;
  } else {
    newSinceScroll++;
    jumpNEl.textContent = newSinceScroll;
    jumpEl.classList.add('show');
  }
}

function repaint() {
  const kept = allLines.filter(passes);
  logEl.innerHTML = '';
  if (!kept.length) {
    logEl.innerHTML = `<div class="empty">No line in the ${allLines.length}-line buffer matches the current level and substring filters.</div>`;
  } else {
    kept.forEach(appendLine);
  }
  logEl.scrollTop = logEl.scrollHeight;
  updateStatus();
}

/* Footer left: "N shown / M lines · level all · filter off" */
function updateStatus() {
  const shown = allLines.filter(passes).length;
  const total = allLines.length;
  const countText = shown === total ? total + ' lines' : shown + ' shown / ' + total + ' lines';
  const offLevels = Object.keys(levels).filter(k => !levels[k]);
  const levelText = offLevels.length
    ? (Object.keys(levels).filter(k => levels[k]).join('+') || 'none')
    : 'all';
  const f = filterEl ? filterEl.value.trim() : '';
  const filterText = f ? `"${f}"` : 'off';
  const text = `${countText} · level ${levelText} · filter ${filterText}`;
  if (con.setTermStatus) con.setTermStatus(text);
  else con.setFooterIdentity(text);
}

/* ---- scroll behavior ---- */

logEl.addEventListener('scroll', () => {
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  if (atBottom) {
    autoscroll = true;
    newSinceScroll = 0;
    jumpEl.classList.remove('show');
  } else {
    autoscroll = false;
  }
});

jumpEl.addEventListener('click', () => {
  logEl.scrollTop = logEl.scrollHeight;
  autoscroll = true;
  newSinceScroll = 0;
  jumpEl.classList.remove('show');
});

/* ---- filter / level controls ---- */

filterEl.addEventListener('input', () => { repaint(); });

document.querySelectorAll('.lvl').forEach(b => {
  b.addEventListener('click', () => {
    levels[b.dataset.lvl] = !levels[b.dataset.lvl];
    b.classList.toggle('on', levels[b.dataset.lvl]);
    repaint();
  });
});

document.getElementById('btn-clear-filter').addEventListener('click', () => {
  filterEl.value = '';
  Object.keys(levels).forEach(k => levels[k] = true);
  document.querySelectorAll('.lvl').forEach(b => b.classList.add('on'));
  repaint();
});

document.getElementById('btn-copy').addEventListener('click', () => {
  const txt = allLines.filter(passes).map(o => (o.t ? o.t + ' ' : '') + o.lv + ' ' + o.raw).join('\n');
  const n = allLines.filter(passes).length;
  const done = () => toast('Copied ' + n + ' lines');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(done);
  } else {
    done();
  }
});

/* ---- Pause (⌘P / Ctrl+P) ---- */

function setPauseState(p) {
  const wasPaused = paused;
  paused = p;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  btn.classList.toggle('on', paused);
  con.setStreamState(paused ? 'paused' : (streamDown ? 'down' : 'streaming'));
  // On resume, backfill the lines that arrived into allLines while rendering
  // was frozen — the stream never stopped, so they are already buffered.
  if (wasPaused && !paused) repaint();
}

document.getElementById('btn-pause').addEventListener('click', () => setPauseState(!paused));

document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'p' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    setPauseState(!paused);
  }
});

/* ---- stream state ---- */

let streamDown = false;
let controller = null;

function setDown(down) {
  streamDown = down;
  if (down) {
    bannerEl.classList.add('show');
    con.setStreamState('down');
  } else {
    bannerEl.classList.remove('show');
    con.setStreamState(paused ? 'paused' : 'streaming');
  }
}

/* ---- /log stream consumer ---- */

/* ingestLine adds one raw text line from the stream. Heartbeat (blank)
   lines emitted by the server for keepalive are silently discarded. */
function ingestLine(rawLine) {
  if (rawLine === '') return;   // server keepalive newline — skip
  const o = { t: '', lv: classifyLevel(rawLine), raw: rawLine };
  allLines.push(o);
  if (allLines.length > BUFFER) allLines.shift();
  if (!paused && passes(o)) appendLine(o);
  updateStatus();
}

async function readStream(reader) {
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl);
      buf = buf.slice(nl + 1);
      ingestLine(line);
    }
  }
  if (buf !== '') ingestLine(buf);
}

async function connect() {
  if (controller) controller.abort();
  controller = new AbortController();
  setDown(false);
  con.setStreamState('connecting');

  try {
    // VMRAuth.guard handles 401: shows the shared auth modal, retries once.
    const resp = await VMRAuth.guard(() =>
      fetch('/log', {
        headers: VMRAuth.has() ? { 'Authorization': 'Bearer ' + VMRAuth.get() } : {},
        signal: controller.signal,
      })
    );
    if (!resp.ok || !resp.body) {
      throw new Error('HTTP ' + resp.status);
    }
    con.setStreamState('streaming');
    await readStream(resp.body.getReader());
    // Server closed the connection (restart / shutdown) — treat as down.
    setDown(true);
  } catch (err) {
    if (err && err.name === 'AbortError') return;   // superseded by a newer connect()
    setDown(true);
  }
}

/* Reconnect button in the disconnection banner */
document.getElementById('btn-retry').addEventListener('click', () => connect());

// 页面 load 时异步拉一次 /status 更新 header
async function refreshStatus() {
  try {
    const resp = await VMRAuth.guard(() => fetch('/status'));
    if (!resp.ok) return;
    const d = await resp.json();
    ConsoleAlerts.set((d.alerts || []));
    const inst = d.instance || {};
    con.setUptime(inst.uptime ? 'up ' + inst.uptime : '—');
    con.setFooterIdentity(`Virtual Model Router (VMR) · ${inst.version || '—'} · pid ${inst.pid || '—'} · ${inst.go_version || ''} · ${inst.os_arch || ''} · listen ${inst.listen || ''}`);
  } catch (_) {}
}
document.addEventListener('DOMContentLoaded', refreshStatus);

/* ---- boot ---- */
updateStatus();
connect();
</script>
</body>
</html>
