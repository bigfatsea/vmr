# Ver 2026-08-07, by Opus 5
#
# Hand-maintained pricing additions — primarily first-party domestic vendor
# models the generated table (tools/gen_standard_pricing, sourced from a
# LiteLLM snapshot) under-covers. See
# docs/VirtualModelRouter_Design_v4_Quota.md's §13 "标准表对国产第一方
# 覆盖不全" for why this gap exists.
#
# tools/gen_standard_pricing NEVER writes to this file — only
# standard_price_generated.yaml. Rows here win over standard_price_generated.yaml
# on a matching canonical key (whole-row replacement, not a per-component
# merge — see internal/pricing.Merge).
#
# Starts empty deliberately: an unverified price is more dangerous than a
# missing one (this whole package's stance — see internal/pricing.Rate's
# doc comment). Add a row only once you've confirmed it against the
# vendor's own published pricing, in USD per 1,000,000 tokens, using
# standard_price_generated.yaml's shape:
#
# currency: USD
# generated_at: "2026-08-07"
# rates:
#   - key: some-vendor/some-model
#     in_fresh: 1.0
#     cache_read: 0.1
#     cache_write: 1.25
#     out: 4.0
#
# --- Rows below added 2026-08-09, by Sonnet 5 ---
#
# Every row below was confirmed against the vendor's own official pricing
# page on 2026-08-09 (URL cited per row/group) — not a third-party
# aggregator. CNY -> USD conversion uses 7.1 (the same rate this repo's own
# config.example.yaml/UserGuide use as their worked example) since every
# table this package loads must be USD (see fileTable's doc comment); if
# your own pricing.exchange_rate differs, the *ratio* between components
# here is still correct even if the absolute USD figure drifts slightly —
# only the money-denominated (cost) accounting is affected, never the
# routing decision, which is a ratio internal to one account (see the
# design doc's §14.2 "headroom only needs the ratio to be right").
#
# A missing cache_write here is a genuine, confirmed gap, not an oversight:
# every provider below either explicitly documents no separate cache-write/
# creation charge (DeepSeek, already complete in standard_price_generated.yaml —
# not repeated here), or simply does not publish one — never guessed as
# 0 without a citation saying so (see this file's own "missing beats wrong"
# stance above). A row that stays incomplete after this still helps `vmr
# report`'s best-effort $ estimate; it just can't satisfy a `metric: cost`
# account's stricter Complete gate until the gap is filled with a
# sourced number.
currency: USD
generated_at: "2026-08-09"
rates:
  # Moonshot AI / Kimi (platform.kimi.com) — these three model ids postdate
  # the tools/gen_standard_pricing LiteLLM snapshot (2026-08-07) and have no
  # row there at all. Source: https://platform.kimi.com/docs/pricing/chat-k27-code
  # and https://platform.kimi.com/docs/pricing/chat-k3, both CNY per 1M
  # tokens on the page. cache_write: not published on either page (Kimi's
  # context caching is automatic/implicit, no documented creation fee).
  - key: moonshot/kimi-k2.7-code
    in_fresh: 0.91549    # ¥6.50 / 7.1
    cache_read: 0.18310  # ¥1.30 / 7.1
    out: 3.80282         # ¥27.00 / 7.1
  - key: moonshot/kimi-k2.7-code-highspeed
    in_fresh: 1.83099    # ¥13.00 / 7.1
    cache_read: 0.36620  # ¥2.60 / 7.1
    out: 7.60563         # ¥54.00 / 7.1
  - key: moonshot/kimi-k3
    in_fresh: 2.81690    # ¥20.00 / 7.1
    cache_read: 0.28169  # ¥2.00 / 7.1
    out: 14.08451        # ¥100.00 / 7.1

  # Zhipu AI / GLM (bigmodel.cn) — standard_price_generated.yaml has no
  # direct-vendor Zhipu rows, only reseller entries (fireworks_ai/glm-5p*,
  # openrouter/glm-*, dashscope/glm-5.*), each at that reseller's own price.
  # Source: https://bigmodel.cn/pricing, re-read 2026-08-31 (CNY per 1M
  # tokens; columns are 输入 / 输出 / 缓存写入 / 缓存命中).
  #
  # cache_read comes from that page's own 缓存命中 column. It used to be
  # written here as "50% of in_fresh", inferred from the cache doc's worked
  # example — the published column says ¥1.3 for GLM-5.1 [0,32K) and ¥2 for
  # GLM-5.2/5.3, i.e. the inference ran 2.3x and 2x HIGH. On this repo's own
  # traffic (cache-hit rates of 70-99%) cache_read dominates the bill, so an
  # inferred cache price is not a rounding error; every row here now carries
  # a published figure or no figure at all.
  #
  # GLM-5.1's price is tiered by input length ([0,32K) vs >=32K); the
  # [0,32K) tier is used here as the common case — an account whose traffic
  # runs mostly above 32K input should add a providers[].pricing.overrides
  # entry with the >=32K figures instead. GLM-5.2/5.3 have a single flat 1M
  # tier. cache_write: the page says 限时免费 (free for a limited promotional
  # window) — a promo, not a price, and this schema has no time dimension
  # (see internal/pricing.OverrideRule), so it is OMITTED rather than
  # written as 0.0: a promo that ends would silently under-price forever.
  - key: zhipu/glm-5.1
    in_fresh: 0.84507    # ¥6 / 7.1 ([0,32K) input tier)
    cache_read: 0.18310  # ¥1.3 / 7.1 ([0,32K) input tier, 缓存命中 column)
    out: 3.38028          # ¥24 / 7.1 ([0,32K) input tier)
  - key: zhipu/glm-5.2
    in_fresh: 1.12676    # ¥8 / 7.1 (flat — GLM-5.2 has a single 1M-context tier, no tiering caveat)
    cache_read: 0.28169  # ¥2 / 7.1 (缓存命中 column)
    out: 3.94366          # ¥28 / 7.1
  - key: zhipu/glm-5.3
    in_fresh: 1.12676    # ¥8 / 7.1 (flat 1M context tier, same list price as GLM-5.2)
    cache_read: 0.28169  # ¥2 / 7.1 (缓存命中 column)
    out: 3.94366          # ¥28 / 7.1

  # ByteDance Volcengine / Doubao (volcengine.com) — the existing
  # volcengine/* rows in standard_price_generated.yaml are third-party models
  # RESOLD on the Volcengine platform (deepseek-v3-2-251201 etc, priced 0/0
  # in that snapshot — unusable placeholders), not Volcengine's own Doubao
  # line, which has no coverage there at all.
  # Source: https://docs.volcengine.com/docs/82379/1544106 (CNY per 1M
  # tokens). Volcengine additionally bills cache STORAGE by the hour
  # (¥0.017/1M tokens/hour for both models below) — a pricing dimension
  # pricing.Rate has no field for (it only models per-token components), so
  # it is deliberately omitted here rather than folded into cache_read;
  # an account whose workload leaves data cached for many hours should
  # account for that separately. cache_read below is the per-access
  # cache-HIT price only. cache_write: no separate per-token creation fee
  # published (only the hourly storage fee above, which this schema can't
  # represent).
  - key: volcengine/doubao-seed-2.1-pro
    in_fresh: 0.84507    # ¥6.00 / 7.1
    cache_read: 0.16901  # ¥1.20 / 7.1
    out: 4.22535          # ¥30.00 / 7.1
  - key: volcengine/doubao-seed-2.1-turbo
    in_fresh: 0.42254    # ¥3.00 / 7.1
    cache_read: 0.08451  # ¥0.60 / 7.1
    out: 2.11268          # ¥15.00 / 7.1

  # Tencent Hunyuan (cloud.tencent.com) — no hunyuan/* rows exist anywhere
  # in standard_price_generated.yaml. Source:
  # https://cloud.tencent.com/document/product/1729/97731 (CNY per 1M
  # tokens). Hunyuan-A13B is Tencent's own current general-purpose
  # recommendation ("适用于绝大部分场景"), not a translation/vision/embedding
  # specialty model. No cache pricing of any kind is published anywhere in
  # Hunyuan's docs (not merely a missing field on this one page) — this row
  # stays at 2 of 4 components on purpose; it will never satisfy a
  # `metric: cost` account's completeness gate without an account-level
  # override supplying cache figures from elsewhere (e.g. a negotiated
  # contract), but it still turns `vmr report`'s $ estimate for this
  # provider from "nothing at all" into a real (if partial) number.
  - key: hunyuan/hunyuan-a13b
    in_fresh: 0.07042    # ¥0.5 / 7.1
    out: 0.28169          # ¥2 / 7.1

# ---------------------------------------------------------------------------
# Aliases: bare model name -> the canonical key whose price it means.
#
# A REFERENCE, never a copied number — regenerating standard_price_generated.yaml
# moves every alias's rate with it, so nothing here goes stale on its own.
# Exactly one hop (a target that is itself an alias is a load-time error, see
# internal/pricing.Table.ValidateAliases), and consulted only at resolution
# step ③: a provider that IS the vendor, or that has an exact supplement row
# of its own, still wins.
#
# standard_price_generated.yaml is pure machine prices and writes NO aliases.
# This file is the single source of truth for all built-in aliases.
#
# Precedence (LookupPreferredSuffix) resolves most bare names with no alias
# at all (single first-party wins). An entry belongs here when:
#   1. Two or more NON-reseller vendors carry the same bare name (dashscope
#      reselling DeepSeek/Zhipu/Moonshot alongside Qwen — precedence cannot
#      decide).
#   2. The priced row is a CURATED addition (LiteLLM doesn't carry it).
#   3. A gateway/proxy invented its own model id for a first-party model
#      (thinking-effort tiers like -high).
# ---------------------------------------------------------------------------
aliases:

  # (1) dashscope (阿里云百炼) resells DeepSeek/Zhipu/Moonshot alongside its
  # own Qwen line — a split no per-vendor rank can express (see
  # aggregatorVendors' doc comment: dashscope is first-party for Qwen,
  # reseller for these).
  deepseek-v4-flash: deepseek/deepseek-v4-flash
  deepseek-v4-pro: deepseek/deepseek-v4-pro
  glm-5.1: zhipu/glm-5.1
  glm-5.2: zhipu/glm-5.2
  kimi-k2.7-code: moonshot/kimi-k2.7-code

  # (2) Rows this file adds that LiteLLM's snapshot doesn't carry at all.
  glm-5.3: zhipu/glm-5.3
  kimi-k2.7-code-highspeed: moonshot/kimi-k2.7-code-highspeed
  doubao-seed-2.1-turbo: volcengine/doubao-seed-2.1-turbo
  doubao-seed-2.1-pro: volcengine/doubao-seed-2.1-pro

  # (3) Gateway-invented thinking-effort tiers (seen in this repo's own
  # audit logs as cliproxy/sub2api model ids). The gateway's own margin is
  # not knowable from here; the first-party list price is.
  gemini-3.6-flash-high: gemini/gemini-3.6-flash
  gemini-3.7-flash-high: gemini/gemini-3.7-flash
