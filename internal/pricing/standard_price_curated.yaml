  # Tencent Hunyuan (cloud.tencent.com) — no hunyuan/* rows exist anywhere
  # in standard_price_generated.yaml. Source:
  # https://cloud.tencent.com/document/product/1729/97731 (CNY per 1M
  # tokens). Hunyuan-A13B is Tencent's own current general-purpose
  # recommendation ("适用于绝大部分场景"), not a translation/vision/embedding
  # specialty model. No cache pricing of any kind is published anywhere in
  # Hunyuan's docs (not merely a missing field on this one page) — this row
  # stays at 2 of 4 components on purpose; it will never satisfy a
  # `metric: cost` account's completeness gate without an account-level
  # override supplying cache figures from elsewhere (e.g. a negotiated
  # contract), but it still turns `vmr report`'s $ estimate for this
  # provider from "nothing at all" into a real (if partial) number.
