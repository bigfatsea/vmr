# Ver 2026-08-09, by Sonnet 5
# vmr 配置文件 —— 完整注解参考。只想先跑起来？改用 config.minimal.yaml
# （~10 行），需要调某个旋钮时再回这里查。
# vmr 配置文件 —— 复制为 config.yaml 后按需修改。
# providers = 你手上有什么账号（一个平铺的账号列表）；models = 客户端看到什么、
# 按什么顺序去用它。
#
# providers 是一个平铺列表：每个上游账号一条，不管这个账号实际支持三种入口协议
# （"openai-completions" | "anthropic-messages" | "openai-responses"）里的几种——base_url 本身按协议
# 分 key，所以同一个账号（同一个 api_key、同一条代理策略）可以从一条记录同时
# 支撑多个接入面，不需要重复声明多条。
#
# models 只按虚拟模型名分 key。一个虚拟模型自己顶层的 `capabilities`/
# `max_context_tokens` 是它下面每个候选端点共享的*基线*——只写一次，不用在每个
# models 仅以虚拟模型名为 key。虚拟模型顶层的 `capabilities`/`max_context_tokens`
# 为显式覆盖，优先级高于 `model_defaults`（见下文 model_defaults）。一个模型的
# `endpoints:` 本身按协议作 key（和上面 base_url 的 key 同一套——POST /v1/chat/completions
# 对应 "openai-completions"，POST /v1/messages 对应 "anthropic-messages"，POST /v1/responses
# 对应 "openai-responses"），每个协议 key 下的一条记录是一个 try-order 候选：一个或多个
# provider（按名字去上面的 providers 列表里解析，见下面 providers[] 的说明）、以及一份
# `models:` 上游模型名列表，这些模型名共享这一条的
# priority——每个 (provider, model) 对
# 都会展开成各自独立、单独做健康跟踪的端点，外层按 models 循环、内层按
# providers 循环。上游真实模型的能力与上下文上限集中在顶层 `model_defaults:`
# 统一声明（支持可选的 "*" 通配）；虚拟模型层可以显式覆盖任意维度（如对模型窗口进行降级）。
# 同一个虚拟模型名可以混合协议：在 endpoints: 下同时给
# openai-completions 和 anthropic-messages（或 openai-responses）两个协议桶，它就能同时从
# 这几种入口协议访问到——各自可能有不同
# 的上游候选（见下面的 "agent" 示例）。一条 try-order 记录没法横跨两个协议——
# 它只存在于一个协议 key 之下。
#
# openai-responses 比另外两个更新、覆盖面也更窄：截至撰写本文时只有 DeepSeek
# 和 OpenRouter 明确文档化了兼容 Responses 的端点（MiniMax 暂时还没有），而且
# 两家都强制无状态用法（store:true / 非空的 previous_response_id 会被上游自
# 己拒绝——vmr 从不检查或剥离请求字段，它只负责路由）。
#
# `providers:` 永远是一个列表——单账号场景写 `providers: [p1]`；当好几个账号
# 对同一批上游模型来说是可以互换的候选时，写 `providers: [p1, p2]`：每个具名
# provider 都会先试完当前这个（更优先的）模型，整条记录才会降级到下一个模型
# （见下面 "agent" 示例，openrouter/openrouter2 共享一条记录）。多账号列表主要
# 是为了同一个厂商下有好几个账号的场景，这样 try-order 列表就不用给每个账号、
# 每个模型各写一行。
#
# `fallback_endpoints:`（顶层字段，和 `providers`/`models` 平级）和模型的
# `endpoints:` 一样按协议作 key——它的记录会被追加到每个虚拟模型对应协议 try-order
# 的末尾。形状和 models.<name>.endpoints 的协议桶完全一样，只是只需要声明一次，不用往每个都想
# 要同一档低优先级兜底的模型上都粘贴一遍。一条 fallback 只会挂到那些本来就已经
# 有对应协议入口的虚拟模型上（它从不会给一个模型凭空开一个新的入口协
# 议），一个模型也可以用 `fallback: false` 完全不参与（见下面 "cheap" 示例）。
# 和普通端点组不同，fallback 的 `priority` 是必填项且必须 > 0——省略/写 0 会
# 让它悄悄地和模型自己的真实端点抢占同一档位，而不是老老实实排在它们后面。
# `vmr check` 会在某个 fallback 协议 key 匹配不到任何虚拟模型时告警——这样的桶永远不可能生效。

listen: 127.0.0.1:8800
# api_keys:                      # 可选：给路由器加一层保护（Bearer 或 x-api-key）。每个 key 的
#                                # 尾部同时也是它调用方的标签：`vmr report` 会据此自动为每个标签
#                                # 各写一份 vmr-requests-<tag>.md（索引数据统一存在 vmr-requests.json
#                                # 里），和常规的完整文件并存，不需要额外传参。
#                                #
#                                # 标签 = key 最后 8 个字符里、最后一个 "-" 之后的部分——所以每个
#                                # key 都以 "-<label>" 结尾（例如 ...-alice -> 标签 "alice"）。用
#                                # >= 3-4 个字符，避免两个 key 落到同一个标签上。标签会变成文件名的
#                                # 一部分（做了清洗：非 A-Za-z0-9._- 的字符都替换成 "-"），而 vmr 并
#                                # 不会检测两个*不同*标签清洗后撞车——挑选本身就对文件名安全、且互相
#                                # 有区分度的后缀。每个 key 长度必须 >= 16 个字符，否则标签窗口就是
#                                # 整个 key。
#   - ${VMR_KEY_ALICE}
#   - ${VMR_KEY_OPENCLAW}
#
# 不配置 api_keys：门是开着的，但每个客户端自带的 Authorization/x-api-key 值
# 依然会走同样的打标签处理（这里没有 16 字符下限——它本来就不是密钥）。什么都
# 不带的客户端保持无标签状态。
#
# （单数形式的 `api_key` 已被移除——还在用它的配置会被当成未知字段加载失败，
# 和写错任何其他字段名一样。api_keys 是唯一的鉴权入口。）
# max_attempts: 0                # 上游最多尝试几次；默认 0 = 无上限（把所有可用端点都走一遍）
# max_request_body_mb: 8         # 入站请求体大小上限（是为了稳定性，和审计日志无关）
# max_concurrency: 8             # 全局并发闸门；超出的请求在内存里排队等待（0/不写 = 不限）——单个
#                                 # 在途请求最坏情况下大约占用 ~32MB（8MB 请求体 + 8MB 响应归一化缓冲
#                                 # + 16MB 审计响应副本），带图请求还要另加一段瞬时解码峰值（见下面的
#                                 # image_downscale）；在共享实例上应该显式设置这个值，不要留空
#                                 #（参见 UserGuide.zh.md 的"单请求内存预算"一节）
# https_proxy: http://127.0.0.1:7890   # https 类 base_url 使用的代理服务器地址——这是 vmr 使用代理的
#                                      # 唯一方式（环境变量会被忽略；要引用环境变量请显式写
#                                      # ${HTTPS_PROXY}）。声明这个 URL 本身并不会打开代理——见下面
#                                      # providers[].proxy。
# http_proxy: http://127.0.0.1:7890    # 同上，用于 http 类 base_url（例如局域网里的 llama.cpp 服务）
# image_downscale: 512           # 把内联请求图片缩小到长边这么多像素（0/不写 = 关闭）；某个模型自己下面的
#                                 # image_downscale 会覆盖这个全局值
#                                 # 降采样期间每张图会被解码成位图，大小由**像素数**而非字节数决定（一张 4K
#                                 # 截图 base64 约 1.5MB，解码后约 33MB）——这是 max_request_body_mb 看不见的
#                                 # 一段瞬时峰值。图片逐张解码，超过约 64MP 的直接不解码透传（防解压炸弹）。
#                                 # 用共享实例承接视觉流量时，请把 max_concurrency 设得保守一些。
# extra_redact_headers:           # 需要在审计记录里额外打码的客户端请求头名字，处理方式和内置的
#   - X-Custom-Token              # Authorization/X-Api-Key/Cookie 等列表一样——用于 vmr 本来不知道
#                                  # 该打码的、客户端自定义的鉴权头（大小写不敏感匹配）。不写/留空
#                                  #（默认状态）不改变任何行为。
# log_dir: ~/.vmr/logs           # 审计 JSONL 目录；按原样使用（~/ 会展开）；不写 = ~/.vmr/logs。改这个需要重启
# image_cache_dir: ~/.vmr/image_cache  # 缩图结果缓存目录；规则相同；不写 = ~/.vmr/image_cache；支持热重载
# timeouts:                       # "等多久"——请求路径上的等待上限，Go duration 语法
#   connect: 10s
#   response_header: 120s        # 从上游收到首字节的时间
#   stream_idle: 120s            # 上游响应体（流式、JSON、错误）静默超过这么久就中止
#   probe: 15s                   # 一次后台恢复探测调用的时间上限：半开状态的端点在被允许重新承接真实流量
#                                 # 之前，会先收到一个专用的小探测请求——真实请求从不会因为等待或被分流到
#                                 # 另一个端点的恢复检查而受影响
#
# ttl:                            # "活多久"——生命周期/淘汰，扩展语法：Nd / Nw / Nmo / Ny
#                                 #（不区分大小写；d=24h、w=7d、mo=30d、y=365d；裸数字按天算）。
#                                 # 所有 ttl 字段的零值规则统一：0（含 0d）、不写、负数都表示
#                                 # "用默认值"。不存在"永久"：需要超长期保留请写具体大数
#                                 #（如 90000d ≈ 246 年）。
#   sticky: 10m                  # Sticky Model 亲和窗口的全局默认值（Go duration 语法，0/不写 =
#                                 # 默认 10m）；下面每个端点都可以单独覆盖它——参见 "cheap" 模型的示例；
#                                 # 不管怎么设置都有一个硬上限 24h（sticky 注册表自身的内存淘汰
#                                 # 兜底）——vmr check/start 会拒绝任何超过这个值的设置
#   image_cache: 14d             # 缩图缓存条目闲置这么久就淘汰（0/不写 = 默认 7d）
#   audit_retention: 90d         # 删除超过这么久的审计文件（0/不写 = 默认 90d）。
#                                 # 相比旧的 audit_retention_days 是 Breaking Change：以前 0 表示
#                                 # "永久保留"——这个语义已删除；如果你依赖它，请写 90000d 或更大。

# exchange_rate：一张通用的"1 美元 = X <货币代码>"映射表。它只有两个消费者，
# 且都不在运行态：① 把某个 provider 用非美元书写的 providers[].pricing.rates
# （见下方）归一为 USD（仅当该 provider 的 pricing.currency 不是 USD 时才需要）；
# ② vmr report 的 -currency 展示折算。内置默认汇率表已覆盖常见货币（见
# docs/VirtualModelRouter_Design_v4_Quota.md）——只有需要覆盖默认值，或用到
# 默认表没有的货币时才需要写这里。如果每个 provider 的 pricing.currency 都是
# USD（或不写），且从不给 vmr report 传 -currency，这一整块可以完全省略。
# exchange_rate:
#   CNY: 7.1

# 真实模型默认值：真实上游模型的能力与上下文窗口上限声明，所有虚拟模型共享。
# 不需要时整块可省略（未声明的模型不受约束）。
model_defaults:
  "*":                          # 可选通配兜底
    capabilities: [text, tools]
  MiniMax-M3:                   # key = 真实模型名
    capabilities: [text, tools, image, audio, video, thinking]
    max_context_tokens: 512000
    providers: [openrouter, minimax]   # 不写 = 对所有 provider 生效

# 全局兜底：追加到每个已经有 openai-completions 协议入口的虚拟模型 try-order 末尾（下面的
# coding/cheap/agent 都有——claude 是纯 Anthropic 模型，这个块从不会碰到它，
# 也就不需要给它写 `fallback: false`）。这里的 openrouter2 就是下面
# providers[] 里的第二个账号，选它只是为了拿一个模型下还没声明过的候选，避免
# 这个示例也触发 `vmr check` 的"fallback 与模型自身已声明的端点重复"检查。
fallback_endpoints:
  openai-completions:
    - providers: [openrouter2]
      models: [z-ai/glm-5.2]
      priority: 90              # fallback 记录必须显式声明且 > 0——见上面的说明段落

providers:
  # base_url 必须包含 provider 自己完整的 API 版本号段（/v1、/v3，随它怎么叫）——
  # vmr 只会在后面拼上协议自己的裸路径（OpenAI 用 /chat/completions，Anthropic
  # 用 /messages），不做任何归一化处理。有些 provider 的 OpenAI/Anthropic 接入
  # 面并不是按 "v1" 版本化的（例如火山引擎的 coding-plan 端点用的是 /v3）——这正
  # 是原因所在：把 "/v1" 硬编码进拼接路径会给这些 provider 悄悄拼出错误的 URL。
  #
  # base_url 至少声明一种协议，最多两种都声明——MiniMax 在同一个账号下同时支持
  # 两种接入面，所以一条记录就够，不用拆成两份按协议分开的 minimax 重复声明。
  # 某条 models.<name> 的 endpoints 协议 key 决定某个 try-order 桶用这里面的哪一个。
  #
  # 绝不要把凭据写进 base_url——不要用 user:pass@host 形式的 userinfo，也不要
  # 拼 ?api_key=… / ?token=… 之类的查询参数：base_url 会原样进入审计日志及其
  # 派生报告，凭据会以明文落在里面，vmr 在加载期就会直接拒绝这类配置。凭据请
  # 放在 api_key 字段里（支持 ${ENV} 引用）。
  - name: minimax
    base_url: {openai-completions: https://api.minimaxi.com/v1, anthropic-messages: https://api.minimaxi.com/anthropic/v1}
    api_key: ${MINIMAX_PLAN_KEY}
    # disabled: true             # 临时下线整个 provider(含其全部 endpoint 展开,包括 api_keys
    #                            # 子账户与 fallback 引用):所有下游消费点都把它当作不存在——不路由、
    #                            # /status 不出现、不计 quota。改回 false 并 reload 即恢复。
    #                            # 期间 vmr check 会对仍引用它的 endpoint 给出 warning(不是 error)。
    # proxy: false               # 这里不需要——不写默认就是直连(国内 provider,
    #                            # 没必要专门写出来)。
    #
    # quota：额度感知路由（Quota-Aware Routing）——完整设计见
    # docs/VirtualModelRouter_Design_v4_Quota.md，当前实际落地状态见该文档
    # 「现状与后续计划」一节。不写 = 不计量，行为完全不变。
    # 当多个 provider 各自都配了 quota: 时，vmr 会把新会话优先导向"相对于当前
    # 账单周期已经过去的比例而言，余量最充裕"的那个账号——不是绝对剩余额度最多
    # 的那个（一个即将重置的套餐"赢面"要小于一个额度还没用完、但即将过期的套餐）。
    #
    # 一个 provider 现在可以配任意条 limits:（P3）——账号里*周期最长*的那条
    # 窗口是它的"桶"（余量真的是不用就浪费，所以桶里有富余会主动抬高分数——
    # "不用就作废"）；其余更短的窗口都是"闸"：厂商真实限流的本地代理。活着的
    # 闸（used < amount）完全不参与评分；用满烧断的闸把分数归零，直到窗口重置
    # ——所以闸的 amount 要设得比厂商真实限流*紧一点*，留出校准误差和在途请求
    # 的余量。只配一条依然是最常见的写法，行为和以前完全一样。rolling: true
    # 仍是加载期的"计划在后续批次支持"报错，不是静默无操作。
    #
    # amount 必须按 VMR 自己实际观测到的口径来校准，不能照抄套餐的宣传数字：
    # 有些厂商把"一次用户交互"计成一个单位，但一个 agent 类客户端（带工具调用、
    # 重试）会把它变成十几次甚至更多真实的 HTTP 请求，vmr 看到的是这些真实请求
    # ——等流量真的跑起来之后，用你自己 `vmr report` 的数字（或者
    # /status 的 quota 部分观察几天）去设置 amount，不要用厂商公布的额度。
    # quota:
    #   limits:
    #     - metric: requests       # 或者：tokens（Credits/金额制套餐换算一次：预算 ÷ 价格，写成
    #                              # token 数即可——见下面 token_weights/model_multipliers 表达
    #                              # 按分量/按模型的差异；已经没有 metric: cost 了，见
    #                              # docs/future-strategy/pricing_architecture_simplification_plan.md）
    #       every: 1min            # N{min,h,d,w,mo}——也可以是 5h、2w、3d
    #       amount: 60             # 一条按分钟限速的闸（限速，不是账单周期）
    #
    #     - metric: requests
    #       every: 1mo             # 这里周期最长——它是桶
    #       since: 2026-08-01      # 周期锚点；后续每个周期都会自动推算。完全不写
    #                              # 就对齐到该单位的日历边界（min/h/d→当日午夜、
    #                              # w→周一、mo→月初），使同周期内的热重载不清零
    #                              # 计数——可接受写法：YYYY-MM-DD、RFC3339，或者
    #                              # 纯时间 hh:mm[:ss]（仅限 every 是 min/h 的 Limit）
    #       amount: 90000          # 这个窗口的上限，单位是 vmr 自己观测到的口径
    #
    #       # token_weights（P2.1）：对 metric: tokens 档 Limit 的 base(tokens) 求和
    #       # 做逐分量的缩放——P3 起按 Limit 配置（实测发现同一账号的不同窗口未必
    #       # 共用同一套折算比例）。整体不写，或者某个分量不写，都缺省为 1.0（也
    #       # 就是最朴素的等权 token 总数）——只在这条 Limit 自己的 metric 就是
    #       # tokens 时才有意义（也只有这种情况下配置校验才会接受它）。当账号自己
    #       # Credits 制的折算比例（比如缓存命中读只算新鲜输入的一部分价格）在所
    #       # 有模型间是统一的时候用它；如果这个比例是*按模型*分化的，把差异写
    #       # 进下面的 providers[].pricing（供 vmr report 估算 $），预算本身依然
    #       # 用 tokens 表达。
    #       # token_weights: {in_fresh: 1.0, cache_read: 0.1, cache_write: 1.25, out: 4.0}
    #       # 想在多条窗口间复用同一套，就在第一次出现处锚定、后面别名引用（优先
    #       # 用它，别用整条目 `<<: *entry` 合并键——那会把 amount/every 也带过去）：
    #       #   token_weights: &tw {in_fresh: 1.0, cache_read: 0.1, cache_write: 1.25, out: 4.0}
    #       #   # ...后面某条 Limit 上：  token_weights: *tw
    #
    #       # model_multipliers（P2.1）：按模型对一次计费的*所有*分量（包括
    #       # requests）整体缩放，在计费落地的那一刻生效——不是读取时才套用。P3
    #       # 起同样按 Limit 配置。"*" 是通配兜底，用于任何没有具名列出的模型；
    #       # 一条既没有具名项也没有 "*" 的 Limit 不缩放（1.0）。
    #       # model_multipliers: {"*": 1.0, heavy-model: 9}
    #
    #       # models（Scope）：同时决定"这条 Limit 对哪些模型生效"和"这些模型是
    #       # 共享一个池还是各自独立"。不写（上面这个形态）＝这个 provider 下所有
    #       # 模型，共享一个池。只要设置了这个字段——不管是 "*" 还是具体列表——
    #       # 就切换成按模型独立计数：
    #       #   models: ["*"]                 # 所有模型，但每个模型各自独立一个池（比如按模型限速）
    #       #   models: [premium-model]        # 只有这一个模型，它自己独立一个池；其它模型不受这条 Limit 影响
    #       # "*" 是保留 token，不是通配符——"gpt-*" 匹配不到任何东西，把 "*"
    #       # 和一个具名条目写在一起是加载期错误（通配符已经覆盖了它）。
    #       # /status 只展示真的产生过计费的模型各一行，不是每条 Limit 一行。

  # providers[].pricing：完全可选，只用来帮 vmr report/vmr analyze 的 $ 估算
  # 与 vmr check 的展示更精确——绝不影响请求路径、路由或配额（见
  # docs/future-strategy/pricing_architecture_simplification_plan.md）。不
  # 配置也会有一份内置标准价目表生效；这个块只声明"这个账号跟标准表不一样
  # 的地方"。
  # - name: anthropic              # 把 provider 命名成它的厂商本名，有助于下面的自动
  #                                 # 模型名解析找到标准表里匹配的条目
  #   base_url: {anthropic-messages: https://api.anthropic.com}
  #   api_key: ${ANTHROPIC_API_KEY}
  #   pricing:
  #     currency: CNY                # 解析期标注：下面 rates 行按人民币书写，加载期经顶层
  #                                   # exchange_rate 一次性折算成 USD（不写默认 USD）——不是运行态量
  #     aliases:                     # 只在自动解析猜不出你的模型名时才需要——
  #       my-claude-alias: anthropic/claude-3-7-sonnet-20250219  # vmr 自己的模型名 -> 标准表的 canonical key
  #     rates:                       # first-match-wins；每条要么是 discount，要么是全部四个
  #       # 分量（in_fresh/cache_read/cache_write/out）一起给，从不混着写或只给一部分。
  #       # 具体模型的规则要写在 "*" 通配兜底规则前面——反过来写会让具体规则变成永远
  #       # 不会命中的死配置（vmr 加载期直接拒绝）；这里没有限时促销/错峰时间窗，
  #       # 只有按模型的静态价格。
  #       - {model: my-model-x, in_fresh: 1.58, cache_read: 0.32, cache_write: 1.58, out: 9.54}  # 这个账号对某个模型的实际谈判价，CNY（上面的 pricing.currency）
  #       - {model: "*", discount: 0.6}  # 兜底：这个账号上其余所有模型统一按列表价 6 折

  # 一个完整的 Scope 组合示例：账号总限（共享池）叠加某个具体模型的独立子额度——
  # 这是一种合法且常见的组合，不是冲突（不同窗口的共享 Limit 和按模型 Limit 从来
  # 不会撞到同一个 bucket key；一般规则见上面 models: 那段注释）。
  # - name: plan-with-submodel-cap
  #   base_url: {openai-completions: https://api.example.com/v1}
  #   api_key: ${EXAMPLE_API_KEY}
  #   quota:
  #     limits:
  #       - {metric: requests, every: 1mo, amount: 50000}                       # 账号下所有模型，共享一个池
  #       - {metric: requests, every: 1d, amount: 200, models: [premium-model]} # 只有 premium-model，它自己独立一个池

  - name: openrouter
    # OpenRouter 在同一个 base 上支持全部三种接入面——包括一个（截至撰写本文时
    # 还是 Beta 的）兼容 Responses 的端点，强制无状态：store:true / 非空的
    # previous_response_id 会被 OpenRouter 自己返回 400，vmr 不拦截这个行为。
    base_url: {openai-completions: https://openrouter.ai/api/v1, anthropic-messages: https://openrouter.ai/api/v1, openai-responses: https://openrouter.ai/api/v1}
    api_key: ${OPENROUTER_API_KEY}
    # proxy: true                # 按 provider 单独控制的开关：true = 始终走上面的
                                 # https_proxy/http_proxy；不写/false = 直连（默认
                                 # 行为）。没有全局默认值可以继承——每个 provider
                                 # 都要显式决定自己是否走代理。也没有环境变量兜底；
                                 # true 但没有对应代理 URL 会校验失败——这也是这行
                                 # 在这里保持注释掉的原因，和上面的 https_proxy 一起：
                                 # 这份文件本身要能原样通过 `vmr check`。要打开就把
                                 # 两处一起取消注释。YAML 1.2：写 true/false，不要写
                                 # on/off。

  - name: deepseek
    base_url: {openai-completions: https://api.deepseek.com/v1, anthropic-messages: https://api.deepseek.com/anthropic/v1}
    api_key: ${DEEPSEEK_API_KEY}

  # 第二个 OpenRouter 账号——比如一个团队/备用 key——放在这里纯粹是为了演示下面
  # "agent" 示例里的 `providers: [...]` 多账号合并写法，以及上面 models: 之前
  # 那个顶层 `fallback_endpoints:` 块。实际部署只有在真的有两个同厂商账号时才需要这样
  # 再加一条 provider 记录。
  - name: openrouter2
    base_url: {openai-completions: https://openrouter.ai/api/v1, anthropic-messages: https://openrouter.ai/api/v1, openai-responses: https://openrouter.ai/api/v1}
    api_key: ${OPENROUTER_API_KEY}   # 真正的第二个账号应该引用自己的 ${VAR}——这里
                                     # 复用同一个变量，只是为了让这份文件在只设了一个
                                     # key 的情况下也能干净地加载通过

  # 如果某个 provider 的 API 不接受全部 OpenAI 角色，可以在它自己的
  # role_map 上做重写——一份简单的旧值->新值映射，在请求体发往上游之前应用到
  # 顶层 "messages" 数组里的 "role" 字段上，对该账号下的所有端点生效。
  # 典型场景：有些 provider（比如 DashScope/通义千问）拒绝 OpenAI 给 o1/o3 系列
  # 模型引入的 "developer" 角色——把它映射回 "system" 就能让这些客户端在完全
  # 不改客户端代码的情况下正常工作。同一个 provider 也可以声明 sticky_ttl，
  # 覆盖全局 ttl.sticky（如 DeepSeek 基于磁盘的 prompt cache 能维持几小时到
  # 几天——远超 10 分钟的全局默认值）。只有列出的那些角色会被影响；
  # 请求的其余每个字节都原样保留。
  # - name: dashscope
  #   base_url: {openai-completions: https://dashscope.aliyuncs.com/compatible-mode/v1}
  #   api_key: ${DASHSCOPE_PLAN_KEY}
  #   role_map: {developer: system}
  #   # sticky_ttl: 2h

models:
  coding:
    # strategy 默认是 [priority]——priority 目前是唯一实现的维度，所以这个
    # 列表暂时没有别的可以写。
    # 下面这些端点都没有显式写 priority——都缺省是 0，打平的情况下按本文件里
    # 出现的顺序排列，所以只要按你想尝试的顺序把它们列出来就够了。
    #
    # capabilities/max_context_tokens（条件路由）都是可选的，缺省是"不受约束"
    # ——像下面每条端点一样不写它们，行为和这些字段还不存在时完全一样。
    # sticky 本身（会话亲和性）每个虚拟模型默认是 true；下面的 "cheap" 模型示例
    # 演示了怎么整体关掉。role 重写与 sticky-TTL 覆盖在 provider 上声明
    # （见上方 providers:），不在这里。完整参考见 docs/UserGuide.zh.md 的
    # "基于条件的路由"/"Sticky Model" 一节。
    endpoints:
      openai-completions:
        - providers: [openrouter]
          models: [z-ai/glm-5.2]
        - providers: [deepseek]
          models: [deepseek-v4-pro]

  cheap:
    max_context_tokens: 128000  # 虚拟模型层显式覆盖：降级上下文窗口
    # image_downscale: 0        # 按模型覆盖的示例：强制这个模型跳过缩图，即使
                                 # 上面全局设置是开着的（不写就继承全局设置）
    # sticky: false              # 对确实是一次性交互、没有多轮价值需要保护的模型，
                                  # 关掉它的会话亲和性
    # fallback: false             # 让这个虚拟模型完全不参与上面的 fallback_endpoints: 块——
                                  # 用于必须严格局限在自己声明的端点内的模型（不写
                                  # 就继承默认值 true，即参与）
    endpoints:
      openai-completions:
        - providers: [minimax]
          models: [MiniMax-M3]
        - providers: [openrouter]
          # 一份含多个名字的 models: 列表会展开成同样多个独立的、各自单独做健康跟踪
          # 的端点，共享这一条记录的 provider/protocol/priority——按
          # 列表顺序依次尝试（每一个仍然有自己独立的 failover/健康状态）。
          models: [tencent/hy3-preview, qwen/qwen3-max]
        - providers: [deepseek]
          models: [deepseek-v4-flash]
          # DeepSeek 基于磁盘的 prompt cache 能维持几小时到几天——在上方
          # providers: 里给这个 provider 写 sticky_ttl: 2h，它名下的所有
          # deepseek 端点都会继承（见那里的注释示例）

  # "agent" 在同一个虚拟模型名下混合了全部三种入口协议：openai-completions 协议的记录只能
  # 从 POST /v1/chat/completions 到达，anthropic-messages 协议的记录只能从
  # POST /v1/messages 到达，openai-responses 的记录只能从 POST /v1/responses
  # 到达——三种协议上的客户端都可以请求 "agent"，各自拿到自己独立的 try-order
  # 列表，彼此只共享一个名字，别无其他。
  #
  # 后端模型从上文的 model_defaults 继承能力与上下文上限声明（MiniMax-M3 获得
  # 512k token 窗口与全模态能力，其余模型继承 "*" 基线）。
  agent:
    endpoints:
      openai-completions:
        - providers: [openrouter, openrouter2]   # 多账号合并：外层按 models 循环，内层
          models: [gemini-3.6-flash-high, gemini-3.1-pro-high]   # 按 providers——gemini-3.6-flash-high
          #                                                       # 先试 openrouter 再试 openrouter2，
          #                                                       # 然后 gemini-3.1-pro-high 同样再来一遍
      anthropic-messages:
        - providers: [minimax]
          models: [MiniMax-M3]
      openai-responses:
        - providers: [openrouter]
          models: [gemini-3.6-flash-high]

  # 仅 Anthropic 的虚拟模型：只能通过 POST /v1/messages 到达。
  # "claude" 不需要 openai-completions 协议的记录——openai-completions 那一侧没有任何地方引用它，通过
  # POST /v1/chat/completions 请求它只会找不到路由，因为那个入口从来只看
  # openai-completions 协议桶下的记录。
  claude:
    endpoints:
      anthropic-messages:
        - providers: [minimax]
          models: [MiniMax-M3]
        - providers: [deepseek]
          models: [deepseek-v4-pro]
        - providers: [openrouter]
          models: [minimax/minimax-m3] # 任意 OpenRouter 模型，用 anthropic-messages 协议来说话
