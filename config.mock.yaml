# Ver 2026-09-15, by Sonnet 5
# config.mock.yaml — 全字段假数据示例。
# 用途:展示 config.yaml 支持的全部可配项;所有密钥/api_key/api_keys 用 ${VAR} 占位,
# provider/model 名称、URL、计费周期、配额数值等全部使用虚构但合规的值。
#
# 注意:少数字段之间存在互斥或依赖关系,已在对应位置以中文短备注点明;
#      标注 〔冲突示例〕 的字段同时启用会导致 vmr check 报错,这里只展示其中一个
#      合法形态。其它字段都是 vmr check 可通过的合法形态。

listen: 0.0.0.0:8800

api_keys:
  # 命名约定:每个 key 末尾 "-<标签>"(标签 ≥ 3 字符),后 8 字符中最后一个 "-" 之后
  # 的片段会作为审计报告中的 caller tag。注释中给出标签位置示例。
  - vmr-devkey-alice-prod-001          # tag = "prod-001"
  - vmr-devkey-bob-staging-002         # tag = "staging-002"

max_attempts: 0                         # 0 = 走遍所有可用 endpoint
max_request_body_mb: 16
max_concurrency: 32                     # 0 = 无上限;此处置写大值作全安阀

https_proxy: ${HTTPS_PROXY}             # e.g. http://127.0.0.1:7890
http_proxy: ${HTTP_PROXY}               # e.g. http://127.0.0.1:7890

image_downscale: 1024                   # 全局默认值;模型级可覆盖
extra_redact_headers:
  - X-Tenant-Token
  - X-Org-Auth
log_dir: ~/.vmr/logs
image_cache_dir: ~/.vmr/image_cache

timeouts:                # 等多久:请求/连接/响应全路径上限(Go Duration 语法)
  connect: 10s
  response_header: 120s
  stream_idle: 120s
  probe: 15s             # 后台恢复探针的单次上限

ttl:                     # 活多久:生命周期/淘汰(扩展语法 d/w/mo/y)
  sticky: 10m            # Sticky 亲和窗口;Go 语法(min/h 量级),≤ 24h (StickyBackstopTTL)
  image_cache: 14d
  audit_retention: 90d   # 0/未写 = 用默认 90d;不支持“永久”语义,长期保留写大数(如 90000d)

# 全局定价块。一旦任意 provider 配 metric: cost 或显式 pricing.overrides,
# 此处 currency 就成了计费/报告的统一单位。
pricing:
  currency: CNY
  exchange_rate: {CNY: 7.1, USD: 1.0}
  supplement: ./pricing.mock.yaml     # 相对路径以本 config 所在目录为锚
  # standard: ./pricing.yaml          # 〔罕见〕 整张替换内建 standard 表,再用 supplement 叠覆

# 全局 fallback:按协议分桶(map),仅附加到已在对应 protocol 上有入口的虚拟模型;
# priority 必填且 > 0 —— priority 数值越小越优先,> 0 即排在真实 endpoint(默认 0)之后。
fallback_endpoints:
  openai-completions:
    - providers: [openrouter2]
      models: [mock-cheap/backup-1]
      priority: 90
  # 〔对比示例〕 anthropic-messages 协议的 fallback:
  #   anthropic-messages:
  #     - providers: [anthropic]
  #       models: [mock-claude-haiku]
  #       priority: 80

providers:

  # ─── 多协议(provider 声明两种 base_url) + quota(请求限频 + 计数周期) ───
  - name: minimax
    base_url:
      openai-completions: https://api.minimaxi.com/v1
      anthropic-messages: https://api.minimaxi.com/anthropic/v1
    api_key: ${MINIMAX_PLAN_KEY}
    # disabled: true                       # 临时下线:整个 provider 及其全部 endpoint 展开都不参与路由,
    #                                      # 改回 false 并 reload 即恢复
    proxy: false                           # 国内厂商直连,默认即此
    quota:
      limits:
        # 短时 RPM 风格的 gate(非 bucket),只抑制分数,不抬分
        - {metric: requests, every: 1min, amount: 60}
        # 最长窗口 → bucket("用进废退"会主动抬分)
        - {metric: requests, every: 1mo, since: 2026-09-01, amount: 90000}
        # 仅对 premium-model 独立计数的 per-model RPM gate
        - {metric: requests, every: 5min, amount: 30, models: [premium-model]}

  # ─── 单 api_keys(自动展开为 provider-minimax-main / provider-minimax-backup) ───
  # 〔冲突示例〕 与上方 minimax 同时启用会导致 api_key+api_keys 同名冲突,
  # 这里注释以保留形态参考;启用时删去上方 minimax 或重命名其一。
  # - name: minimax-multi
  #   base_url: {openai-completions: https://api.minimaxi.com/v1}
  #   api_keys:
  #     main:    ${MINIMAX_KEY_MAIN}
  #     backup:  ${MINIMAX_KEY_BACKUP}

  # ─── 全三协议 + quota(tokens + metric:cost + pricing 全形态) ───
  - name: anthropic
    base_url:
      openai-completions: https://api.anthropic.com/v1
      anthropic-messages: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    proxy: true                            # 出境流量走 https_proxy
    quota:
      limits:
        # tokens Limit + token_weights:cache 读 1/10、写 1.25 折算
        - {metric: tokens, every: 1d, amount: 1000000,
          token_weights: {in_fresh: 1.0, cache_read: 0.1, cache_write: 1.25, out: 4.0}}
        # metric: cost 周期:必须搭配 providers[].pricing.overrides 全四要素
        - {metric: cost, every: 1mo, since: 2026-09-01, amount: 500}
        # 〔冲突示例〕 rolling: true  ← 一旦启用即被 reject("rolling 计划稍后批次")
        # - {metric: requests, every: 1h, amount: 100, rolling: true}
    pricing:
      map:                                 # 本地别名 → 标准表 canonical key
        my-claude-alias: anthropic/claude-3-7-sonnet-20250219
      overrides:
        # 具体条目先于 wildcard;四项显式费率必同时给出,缺一即报错
        - {model: my-model-x,
           in_fresh: 1.58, cache_read: 0.32, cache_write: 1.58, out: 9.54}
        # 另一条目用 USD 报价,通过 exchange_rate 转 CNY
        - {model: my-model-y, currency: USD,
           in_fresh: 1.0, cache_read: 0.1, cache_write: 1.25, out: 4.0}
        # 通配兜底:6 折,所有未显式命名的模型走折扣
        - {model: "*", discount: 0.6}

  # ─── 三协议同基址(provider 也展开全三面)+ model_multipliers ───
  - name: openrouter
    base_url:
      openai-completions: https://openrouter.ai/api/v1
      anthropic-messages: https://openrouter.ai/api/v1
      openai-responses:   https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    proxy: true
    quota:
      limits:
        # 计数维度的 RPM gate
        - {metric: requests, every: 1min, amount: 100}
        # 月度 bucket + model_multipliers(per-model 缩放):
        #   通用条目先列,否则会被 wildcard 兜底死代码
        - {metric: requests, every: 1mo, since: 2026-09-01, amount: 50000,
           model_multipliers: {heavy-model: 9, "*": 1.0}}

  # ─── Provider 级 sticky_ttl(DeepSeek 磁盘 cache 数小时~数天) ───
  - name: deepseek
    base_url:
      openai-completions: https://api.deepseek.com/v1
      anthropic-messages: https://api.deepseek.com/anthropic/v1
    api_key: ${DEEPSEEK_API_KEY}
    proxy: false
    sticky_ttl: 2h

  # ─── 第二份同厂商账户:用于多账号合并 + fallback 演示 ───
  - name: openrouter2
    base_url:
      openai-completions: https://openrouter.ai/api/v1
      anthropic-messages: https://openrouter.ai/api/v1
      openai-responses:   https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY_2}
    proxy: true

  # ─── Provider 级 role_map(百炼网关拒收 developer role,统一改写) ───
  - name: dashscope
    base_url:
      openai-completions: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${DASHSCOPE_PLAN_KEY}
    proxy: false
    role_map: {developer: system}

# ─── 能力/上下文声明:按真实模型横向归一,同一模型跨虚拟模型只写一次 ───
# 两字段按维度独立回退:虚拟模型显式声明 > 精准 key > "*" 通配 > unconstrained;
# providers 不写 = 对所有 provider 生效;整块可省略(省略 = 一切 unconstrained)。
model_defaults:
  "*":
    capabilities: [text, tools]
  MiniMax-M3:
    capabilities: [text, tools, image, audio, video, thinking]
    max_context_tokens: 512000
    providers: [openrouter, minimax]

models:

  # ─── 默认 strategy + 默认 priority(按文件顺序) ───
  coding:
    # strategy 默认 [priority];此处显式列出无副作用
    # priority 数值越小越优先(本块内两条均未写 priority,同为 0,按文件顺序 try)
    strategy: [priority]
    endpoints:
      openai-completions:
        - providers: [openrouter]
          models: [z-ai/glm-5.2]
        - providers: [deepseek]
          models: [deepseek-v4-pro]

  # ─── 各种可选项集中演示:per-model image_downscale / sticky:false /
  #     fallback:false / 虚拟模型层 override ───
  # (sticky_ttl 与 role_map 已上收至 providers 层,见上方 deepseek/dashscope)
  cheap:
    image_downscale: 0                    # 强制该模型不走下采样,即使全局开启
    sticky: false                         # 单次请求型,关掉 session 粘性
    fallback: false                       # 不接受全局 fallback_endpoints
    max_context_tokens: 128000            # 虚拟模型层显式降级:覆盖 model_defaults 的 512k
    endpoints:
      openai-completions:
        - providers: [minimax]
          models: [MiniMax-M3]
        - providers: [openrouter]
          models: [tencent/hy3-preview, qwen/qwen3-max]
        - providers: [deepseek]
          models: [deepseek-v4-flash]      # sticky_ttl 继承 provider 级 2h
        - providers: [dashscope]
          models: [qwen3-max-preview]      # role_map 继承 provider 级 developer->system

  # ─── 同一虚拟模型名跨三种协议;能力/窗口继承 model_defaults ───
  agent:
    endpoints:
      openai-completions:
        - providers: [openrouter, openrouter2]
          models: [gemini-3.6-flash-high, gemini-3.1-pro-high]
      anthropic-messages:
        - providers: [minimax]
          models: [MiniMax-M3]              # 512k + 多模态事实由 model_defaults 归一声明
      openai-responses:
        - providers: [openrouter]
          models: [gemini-3.6-flash-high]

  # ─── 仅 anthropic-messages 的纯 Anthropic 虚拟模型 ───
  claude:
    endpoints:
      anthropic-messages:
        - providers: [anthropic]
          models: [claude-3-7-sonnet-20250219]
        - providers: [deepseek]
          models: [deepseek-v4-pro]
        - providers: [openrouter]
          models: [anthropic/claude-3-7-sonnet]

  # ─── 额外模型用于演示 metric:cost 计费场景覆盖到 premium-model ───
  premium:
    endpoints:
      anthropic-messages:
        - providers: [anthropic]
          models: [my-model-x]
          priority: -1                      # priority 数值越小越优先:-1 排在默认 0 之前
      openai-completions:
        - providers: [openrouter]
          models: [heavy-model]