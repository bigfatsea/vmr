# Ver 2026-08-09, by Sonnet 5
#
# Your own pricing supplement — copy to pricing.yaml and adjust. Referenced
# from config.yaml's global `pricing:` block via `supplement: ./pricing.yaml`
# (see config.example.yaml's pricing section). pricing.yaml itself is
# .gitignore'd, same as config.yaml — this example is the one meant to be
# committed.
#
# This is the SECOND of vmr's two pricing layers, not the first: vmr always
# ships a built-in standard price table (internal/pricing/standard_price_generated.yaml
# + standard_price_curated.yaml, embedded into the binary — you cannot edit
# those without rebuilding vmr yourself). This file is the layer meant to be
# edited: a row here wins over the built-in table on a matching canonical
# key (whole-row replacement, not a per-component merge — see
# internal/pricing.Merge). Use it for models the built-in table doesn't
# cover yet, or a negotiated/discounted rate that differs from list price
# (though a same-shape rate correction is often better expressed as a
# providers[].pricing.overrides entry in config.yaml instead — see that
# file's own pricing section; use THIS file when the correction should
# apply everywhere that canonical key resolves, not just one account).
#
# Recommended default: most rows are USD-native (the built-in table's own
# currency) — for those, skip currency:/exchange_rate: entirely, this file
# stays exactly as simple as a plain list of USD rates. Only reach for the
# rest of this section once a row's price actually comes from a non-USD
# source (a domestic vendor's own CNY price list, say).
#
# Every amount is per 1,000,000 tokens, in whatever currency the table (or
# an individual row) declares. currency: at the top sets the default for
# every row below it; a row can override that default with its own
# `currency:` field (e.g. a domestic vendor's row entered straight from its
# official CNY price list, even while this file's default stays USD) — write
# the vendor's native-currency number here as-is, don't hand-convert it to
# USD first, vmr does that at load time.
#
# The rate used for that conversion comes from an exchange_rate: block (a
# "1 USD = X <code>" map) — either right here in THIS file (recommended:
# keeps this file fully self-contained/portable, and the row's resolved USD
# price stays pinned even if some other deployment's config.yaml later
# tweaks its own rate for unrelated accounting reasons), or, for any
# currency this file doesn't declare a rate for, falling back to
# config.yaml's own pricing.exchange_rate (see that file's own pricing
# section) — handy if you'd rather not repeat the same rate in every
# supplement file and are fine with it tracking the deployment's rate.
#
# A component you omit means "unknown" to vmr, NEVER "free" — an explicit
# 0.0 is how you spell "actually free". An unverified price is more
# dangerous than a missing one: only add a row once you've confirmed it
# against the vendor's own published pricing (cite the source URL in a
# comment, same convention internal/pricing/standard_price_curated.yaml
# follows).
#
# This file is allowed to be entirely empty (or all comments) — that's a
# valid, empty supplement, not an error. Delete the example rows below
# before using this as your real pricing.yaml if you don't need them.

currency: USD
generated_at: "2026-08-09"
exchange_rate:
  CNY: 7.1   # only needed for currencies the rows below actually use — delete if you don't need CNY, or add more codes as needed
rates:
  - key: some-vendor/some-model
    in_fresh: 1.0      # cost per 1M fresh (non-cached) input tokens
    cache_read: 0.1    # cost per 1M cache-hit input tokens
    cache_write: 1.25  # cost per 1M tokens written into cache (creation)
    out: 4.0           # cost per 1M output tokens

  - key: some-domestic-vendor/some-model
    currency: CNY      # this row's own price list is CNY-denominated — resolved via
                        # this file's own exchange_rate: above, no config.yaml needed
    in_fresh: 7.1
    cache_read: 0.71
    cache_write: 8.875
    out: 28.4
