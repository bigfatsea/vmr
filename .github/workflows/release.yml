name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o vmr ./cmd/vmr
          tar czf vmr_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz vmr vmr.sh README.md README.zh.md LICENSE \
            config.minimal.yaml config.minimal.zh.yaml \
            config.example.yaml config.example.zh.yaml \
            report.example.yaml report.example.zh.yaml \
            pricing.example.yaml pricing.example.zh.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: vmr_${{ matrix.goos }}_${{ matrix.goarch }}
          path: vmr_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      # GitHub's own generate_release_notes just lists PR titles, which is
      # unreadable on this repo's mostly direct-to-main workflow (dependency
      # bumps and real feature commits look identical). CHANGELOG.md is the
      # curated source of truth instead — fail the release rather than
      # publish an empty body if the tag's section is missing.
      - name: Extract this tag's CHANGELOG section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          escaped_tag=$(printf '%s' "$tag" | sed 's/[.[\*^$/]/\\&/g')
          awk -v ver="$escaped_tag" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no [$tag] section — add one before tagging."
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_notes.md

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew tap update."
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"

          darwin_arm64_sha=$(grep "vmr_darwin_arm64.tar.gz" dist/checksums.txt | awk '{print $1}')
          darwin_amd64_sha=$(grep "vmr_darwin_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')
          linux_arm64_sha=$(grep "vmr_linux_arm64.tar.gz" dist/checksums.txt | awk '{print $1}')
          linux_amd64_sha=$(grep "vmr_linux_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bigfatsea/homebrew-tap.git" tap
          cd tap

          cat <<EOF > Formula/vmr.rb
          # Ver $(date -u +'%Y-%m-%d %H:%M'), by github-actions[bot]

          class Vmr < Formula
            desc "Local-first, single-binary LLM router for AI agents (byte-faithful passthrough, failover, flight-recorder audit log)"
            homepage "https://github.com/bigfatsea/vmr"
            version "${tag}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/bigfatsea/vmr/releases/download/v${tag}/vmr_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              else
                url "https://github.com/bigfatsea/vmr/releases/download/v${tag}/vmr_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/bigfatsea/vmr/releases/download/v${tag}/vmr_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              else
                url "https://github.com/bigfatsea/vmr/releases/download/v${tag}/vmr_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "vmr"
            end

            test do
              system "#{bin}/vmr", "version"
            end
          end
          EOF

          sed -i 's/^          //' Formula/vmr.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vmr.rb

          if git diff --staged --quiet; then
            echo "Formula is already up to date"
          else
            git commit -m "vmr ${tag}"
            git push origin master
          fi
