name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o vmr ./cmd/vmr
          tar czf vmr_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz vmr README.md README.zh.md LICENSE config.example.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: vmr_${{ matrix.goos }}_${{ matrix.goarch }}
          path: vmr_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      # GitHub's own generate_release_notes just lists PR titles, which is
      # unreadable on this repo's mostly direct-to-main workflow (dependency
      # bumps and real feature commits look identical). CHANGELOG.md is the
      # curated source of truth instead — fail the release rather than
      # publish an empty body if the tag's section is missing.
      - name: Extract this tag's CHANGELOG section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          escaped_tag=$(printf '%s' "$tag" | sed 's/[.[\*^$/]/\\&/g')
          awk -v ver="$escaped_tag" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no [$tag] section — add one before tagging."
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_notes.md
