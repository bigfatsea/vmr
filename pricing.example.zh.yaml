# Ver 2026-08-09, by Sonnet 5
#
# 你自己的定价补充表——复制为 pricing.yaml 后按需修改。通过 config.yaml 全局
# `pricing:` 块里的 `supplement: ./pricing.yaml` 引用（参见
# config.example.yaml 的 pricing 部分）。pricing.yaml 本身是 .gitignore 的，
# 和 config.yaml 一样——提交进仓库的是这份示例文件。
#
# 这是 vmr 两层定价里的第二层，不是第一层：vmr 总是自带一份内置的标准价目表
# （internal/pricing/standard_price_generated.yaml +
# standard_price_curated.yaml，编译进二进制——不重新编译 vmr 你没法改动它们）。
# 这份文件才是设计给你编辑的那一层：这里的一行一旦在 canonical key 上和内置表
# 撞上，就会整行覆盖内置表里对应的那一行（不是逐分量合并——见
# internal/pricing.Merge）。用它来补内置表还没覆盖到的模型，或者补一个和列表
# 价不同的、谈判到的折扣价（不过同形状的价格修正很多时候用 config.yaml 里的
# providers[].pricing.overrides 表达更合适——见那份文件自己的定价部分；只有当
# 这个修正应该在所有解析到这个 canonical key 的地方都生效、而不只是某一个账号
# 时，才用这份文件）。
#
# 推荐的默认做法：大多数行本来就是 USD 计价（和内置表同一个币种）——这种情况
# 直接不写 currency:/exchange_rate:，这份文件就跟一份普通的美元费率表一样简
# 单。只有当某一行的价格确实来自非美元来源（比如某个国产厂商自己的人民币价目
# 表）时，才需要用到下面这部分。
#
# 下面每个金额单位都是每 1,000,000 token，币种由表（或某一行自己）声明。顶层
# 的 currency: 是下面每一行的默认币种；某一行也可以用自己的 `currency:` 覆盖
# 这个默认值（比如某个国产厂商的一行，直接抄它官网的人民币价目表，即使这份
# 文件的默认币种还是 USD）——把厂商原生货币的数字原样填进来，不要自己先手工
# 换算成 USD，vmr 会在加载时自动换算。
#
# 换算用的汇率来自一个 exchange_rate: 块（一张"1 美元 = X <货币代码>"的映射
# 表）——可以就写在**这份文件自己里面**（推荐做法：这样这份文件完全自包含、
# 可以直接拿去别的部署用，而且这一行解析出来的 USD 价格不会因为别的部署的
# config.yaml 出于记账原因调整了自己的汇率而跟着悄悄漂移），也可以对某个这份
# 文件没声明汇率的货币，退回到 config.yaml 自己的 pricing.exchange_rate（见
# 那份文件自己的 pricing 部分）——如果你不想在每份补充表里重复写同一个汇率、
# 也不介意它跟着部署的汇率走，这样更省事。
#
# 某个分量不写，对 vmr 来说意味着"未知"，绝不是"免费"——显式写 0.0 才是"确实
# 免费"的写法。一个没验证过的价格比缺失的价格更危险：只有在你对照过厂商自己
# 公布的价格之后，才添加一行（在注释里注明来源 URL，和
# internal/pricing/standard_price_curated.yaml 遵循的约定一样）。
#
# 这份文件允许整份都是空的（或者全是注释）——那是一份合法的空补充表，不是错误。
# 如果你不需要下面的示例行，把它们删掉再当成你真正的 pricing.yaml 使用。

currency: USD
generated_at: "2026-08-09"
exchange_rate:
  CNY: 7.1   # 只有下面的行真的用到某个货币时才需要那一条——不需要 CNY 就删掉，或者按需再加别的货币代码
rates:
  - key: some-vendor/some-model
    in_fresh: 1.0      # 每 1M 个新鲜（非缓存命中）输入 token 的价格
    cache_read: 0.1    # 每 1M 个缓存命中输入 token 的价格
    cache_write: 1.25  # 每 1M 个写入缓存的 token 的价格（创建费用）
    out: 4.0           # 每 1M 个输出 token 的价格

  - key: some-domestic-vendor/some-model
    currency: CNY      # 这一行自己的价目表就是人民币计价——靠上面这份文件自己的
                        # exchange_rate: 解析，不需要 config.yaml 配合
    in_fresh: 7.1
    cache_read: 0.71
    cache_write: 8.875
    out: 28.4
