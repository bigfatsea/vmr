# vmr config — the fully annotated reference. Just want to get running?
# Copy config.minimal.yaml instead (~10 lines) and come back here for a knob.
# vmr config — copy to config.yaml and adjust.
# providers = what you have (a flat list of accounts); models = what clients see
# and in which order to use it.
#
# providers is a flat list: one entry per upstream account, however many of
# the three ingress protocols ("openai-completions" | "anthropic-messages" | "openai-responses")
# that account actually speaks — base_url is itself keyed by protocol, so
# the same account (same api_key, same proxy policy) can back several
# surfaces from one entry instead of being declared multiple times.
#
# models is keyed by virtual-model name only. A virtual model's own top-level
# `capabilities`/`max_context_tokens` are the *base* shared by every endpoint
# under it — set once instead of repeating the same declaration on every
# try-order candidate (see the "agent" example below). Each entry under a
# model's `endpoints:` list is one try-order candidate: it names its own
# protocol (which ingress can reach it — POST /v1/chat/completions for
# "openai-completions", POST /v1/messages for "anthropic-messages", POST /v1/responses for
# "openai-responses"), one or more providers (resolved by name against the
# providers list above — see providers[] below), and a `models:` list of
# upstream model names that all share this entry's capabilities/
# max_context_tokens/role_map/sticky_ttl/priority — each (provider, model)
# pair expands into its own independent, individually health-tracked
# endpoint, outer loop over models, inner loop over providers. An entry's
# own `capabilities` is *additive* to
# the model's base (union — declare only what this specific entry adds
# beyond the shared floor); its own `max_context_tokens` *overrides* the
# base instead when set (a single number can't be unioned). A virtual model
# name can mix protocols: give it one endpoint-group entry with protocol:
# openai and another with protocol: anthropic-messages (or openai-responses), and it
# becomes reachable — with potentially different upstream candidates — from
# every one of those ingress protocols at once (see the "agent" example
# below). Mixing protocols within one endpoint-group entry has no syntax to
# express, rather than being a config error to catch: each entry is exactly
# one protocol.
#
# openai-responses is newer and narrower than the other two: as of this
# writing only DeepSeek and OpenRouter document a Responses-compatible
# endpoint (MiniMax doesn't yet), and both force stateless usage (store:true
# / a non-null previous_response_id gets rejected by the upstream itself —
# vmr never inspects or strips request fields, it only routes).
#
# `providers:` always takes a list — `providers: [p1]` for the common
# single-account case, `providers: [p1, p2]` when several accounts are
# interchangeable candidates for the same upstream model(s): every named
# provider is tried, for the preferred model, before the entry falls
# through to its next model (see the "agent" example below, where
# openrouter/openrouter2 share one entry). The common case a multi-name
# list exists for: several accounts on the same vendor, so the try-order
# list doesn't need one line per account per model.
#
# `fallback_endpoints:` (top-level, alongside `providers`/`models`) is a
# list of endpoint-group entries appended to the tail of every virtual
# model's own try-order — the same shape as a models.<name>.endpoints[]
# entry, but declared once instead of pasted onto every model that wants
# the same low-priority catch-all tier. A fallback only attaches to a
# virtual model that already has its own entry point on the fallback's
# `protocol` (it never opens a new ingress a model didn't already have),
# and a model can opt out entirely with `fallback: false` (see the "cheap"
# example below). Unlike an ordinary endpoint-group, a fallback's
# `priority` is required and must be > 0 — omitted/0 would silently
# compete at the same tier as a model's own real endpoints instead of
# trailing behind them.

listen: 127.0.0.1:8800
# api_keys:                      # optional: protect the router (Bearer or x-api-key). Each key's
#                                # tail also tags its caller: `vmr report` then auto-writes a
#                                # vmr-requests-<tag>.md per tag (the index data lives in the
#                                # shared vmr-requests.json), alongside the usual full files. No
#                                # flag needed for this.
#                                #
#                                # Tag = last 8 chars of the key, cut to after the last "-" in that
#                                # window — so end each key "-<label>" (e.g. ...-alice -> tag
#                                # "alice"). Use >= 3-4 chars so two keys don't land on the same tag.
#                                # The tag becomes a filename (sanitized: non A-Za-z0-9._- -> "-"),
#                                # and vmr does NOT detect two DIFFERENT tags colliding after that —
#                                # pick suffixes that are already filename-safe and stay distinct.
#                                # Each key must be >= 16 chars, else the tag window is the whole key.
#   - ${VMR_KEY_ALICE}
#   - ${VMR_KEY_OPENCLAW}
#
# No api_keys configured: the door stays open, but each client's own Authorization/x-api-key
# value still gets the same tag treatment (no 16-char minimum here — it's not a secret). A
# client sending nothing stays untagged.
#
# (Singular `api_key` was removed — a config still using it fails to load as an
# unknown field, same as any other typo. api_keys is the only auth surface.)
# max_attempts: 0                # cap on upstream tries; default 0 = walk every available endpoint
# probe_timeout: 15s             # upper bound on one background recovery-probe call: a half-open endpoint gets
#                                 # a small dedicated probe request before real traffic is allowed back onto it —
#                                 # real requests never wait on or get diverted by another endpoint's recovery check
# max_request_body_mb: 8         # inbound request body size cap (stability, unrelated to audit logging)
# max_concurrency: 8             # global gate; excess requests wait in memory (0/absent = unlimited) — worst case
#                                 # per in-flight request is ~32MB (8MB request + 8MB response-normalization
#                                 # buffer + 16MB audit response copy), plus a transient decode peak for image
#                                 # requests (see image_downscale below); on a shared instance set this explicitly
#                                 # rather than leaving it unlimited (see UserGuide.md's "Per-request memory budget")
# https_proxy: http://127.0.0.1:7890   # proxy server URL for https base_urls — the ONLY way vmr uses a proxy (env vars are
#                                      # ignored; write ${HTTPS_PROXY} to reference one explicitly). Declaring this URL
#                                      # does NOT turn proxying on by itself — see providers[].proxy below.
# http_proxy: http://127.0.0.1:7890    # same, for http base_urls (e.g. a LAN llama.cpp server)
# image_downscale: 512           # shrink inline request images to this many px on the long side (0/absent = off); a model's own image_downscale below overrides this
#                                 # while downscaling, each image is decoded to a bitmap sized by its PIXEL count,
#                                 # not its byte size (a 4K screenshot is ~1.5MB of base64 but ~33MB decoded) —
#                                 # a short-lived peak max_request_body_mb cannot see. Images decode one at a time,
#                                 # and anything over ~64MP is passed through undecoded (decompression-bomb guard).
#                                 # Serving vision traffic from a shared instance? Set max_concurrency conservatively.
# image_cache_ttl_days: 7        # evict downscale-cache entries unused for this many days (0/absent = default 7)
# sticky_ttl: 10m                # global default for Sticky Model's affinity window (0/absent = default 10m);
#                                 # each endpoint below can override it — see the "cheap" model for an example;
#                                 # hard ceiling 24h either way (the sticky registry's own memory-eviction
#                                 # backstop) — vmr check/start reject anything above that
# audit_retention_days: 30       # delete audit files older than this; 0/absent = keep forever (rotation always compresses old days to .zst regardless)
# extra_redact_headers:           # additional client request header names to mask in the audit trail, same
#   - X-Custom-Token              # treatment as the built-in Authorization/X-Api-Key/Cookie/etc list — for a
#                                  # client's own custom auth header vmr doesn't already know to mask (case-
#                                  # insensitive match). Absent/empty (the default) changes nothing.
# log_dir: ~/.vmr/logs           # audit JSONL directory; used exactly as given (~/ expands); absent = ~/.vmr/logs. Changing it needs a restart
# image_cache_dir: ~/.vmr/image_cache  # downscale-result cache directory; same rule; absent = ~/.vmr/image_cache; follows hot reload
# timeouts:
#   connect: 10s
#   response_header: 120s        # time to first byte from upstream
#   stream_idle: 120s            # abort any upstream body (stream, JSON, error) silent for this long

# pricing: global settings for metric: cost quota accounts and vmr report's $
# estimates (see docs/VirtualModelRouter_Design_v4_Quota.md and
# providers[].pricing below for the account-level half). A built-in standard
# price table (sourced from a public LiteLLM-format snapshot) always applies
# with no configuration at all, and vmr report's $ estimates use it with zero
# setup — this whole block is skippable for most deployments.
#
# Recommended default: if you don't use any metric: cost quota limit at all
# (metric: requests/tokens don't need any of this), skip this block entirely.
# If you DO use metric: cost and you're fine accounting in USD, write only
# `pricing: {currency: USD}` — exchange_rate stays empty/unused, and every
# providers[].pricing.overrides row below can just write its numbers in USD
# directly. Only reach for exchange_rate at all once an account's real quota
# cap is denominated in a currency other than USD (a domestic vendor's CNY
# plan, say) — forcing everything through USD in that case just moves the
# manual conversion problem onto amount: below instead of removing it.
# pricing:
#   currency: CNY                # required once any provider has a metric: cost limit; the standard table itself is USD
#   exchange_rate: {CNY: 7.1}    # a general "1 USD = X <code>" map — required whenever currency isn't USD (needs
#                                 # a CNY entry here, since the built-in table is USD-denominated and feeds both
#                                 # metric: cost charging and vmr report's $ column, so skipping it would label
#                                 # USD numbers as CNY). Also the FALLBACK for a providers[].pricing.overrides
#                                 # row's own currency: (see below — overrides live in this same file, so no
#                                 # fallback question there) and for a pricing.supplement row's own currency:
#                                 # (see pricing.example.yaml) that DOESN'T declare its own exchange_rate: block —
#                                 # a supplement file's own block always wins on a matching key, so it can stay
#                                 # portable across deployments; this map only fills in what it doesn't cover.
#                                 # Also consulted by vmr report's -currency display currency when it differs
#                                 # from this one. Write {CNY: 1.0} to state deliberately that no conversion applies.
#   supplement: ./pricing.yaml    # optional: your own additions, same shape as the built-in table
#                                   # (see pricing.example.yaml — copy it to pricing.yaml and adjust),
#                                   # merged in — yours wins on a canonical-key clash. A path that
#                                   # doesn't exist is a load-time error, not a silent skip.

# Global fallbacks: appended to the tail of every virtual model's try-order
# that already has an openai-completions entry (coding/cheap/agent below all
# do — claude is anthropic-messages-only, so this block never touches it, no
# `fallback: false` needed there). openrouter2 here is the second account
# from providers[] below, used only as a distinct, not-already-declared
# candidate so this example doesn't also trip the "fallback duplicates an
# endpoint already declared under this model" check `vmr check` runs.
fallback_endpoints:
  - protocol: openai-completions
    providers: [openrouter2]
    models: [z-ai/glm-5.2]
    priority: 90              # required and must be > 0 on a fallback entry — see the header comment above

providers:
  # base_url must include the provider's own full API version (/v1, /v3,
  # whatever it calls it) — vmr just appends the protocol's bare path
  # (/chat/completions for OpenAI, /messages for Anthropic) with no
  # normalization. Providers that don't version their OpenAI/Anthropic
  # surface as "v1" (e.g. Volcengine's coding-plan endpoint uses /v3)
  # are exactly why: hardcoding "/v1" into the suffix would silently
  # produce the wrong URL for them.
  #
  # base_url declares at least one protocol, up to both — MiniMax speaks
  # both surfaces on the same account, so one entry covers it instead of
  # two (the old format's two separately protocol-keyed minimax declarations
  # duplication). A models.<name> endpoint-group's own `protocol:` picks
  # which of these a given try-order entry actually uses.
  - name: minimax
    base_url: {openai-completions: https://api.minimaxi.com/v1, anthropic-messages: https://api.minimaxi.com/anthropic/v1}
    api_key: ${MINIMAX_PLAN_KEY}
    # proxy: false               # not needed here — absent already means direct (domestic
    #                            # provider, no need to write this out).
    #
    # quota: Quota-Aware Routing — see docs/VirtualModelRouter_Design_v4_Quota.md
    # for the full design and its "现状与后续计划" section for what's actually
    # shipped. Absent = unmetered, no behavior change. When several providers each carry a quota:,
    # vmr biases new sessions toward whichever account has the most slack
    # relative to how much of its billing period has elapsed — not the most
    # quota left in absolute terms (a plan about to reset "wins" less than one
    # about to expire with unused quota).
    #
    # A provider can carry any number of limits: entries (P3) — the tightest
    # constraint decides: the LONGEST window on the account is its "bucket"
    # (unused headroom there really is wasted if not spent, so it actively
    # boosts the score — "use it or lose it"); every other, shorter window is
    # a "gate" (a rate limiter with no economic value in maxing out, so it can
    # only ever suppress the score toward its own saturation, never boost it
    # above what the bucket gives). One entry is still the common case and
    # behaves exactly like before. rolling: true remains a load-time "planned
    # for a later batch" error, never a silent no-op. metric: cost and a
    # pricing: block ARE supported (P2.2) — see the plan-e/plan-f examples
    # further down and providers[].pricing's own comment block.
    #
    # amount MUST be calibrated to what VMR ITSELF OBSERVES, not the plan's
    # marketing number: some vendors bill "one user turn" as a single unit
    # while an agentic client (tool calls, retries) turns that into a dozen-plus
    # real HTTP requests vmr sees — set amount from your own `vmr report`
    # numbers (or a few days of /status's quota section) once traffic is
    # flowing, not from the vendor's published quota.
    # quota:
    #   limits:
    #     - metric: requests       # or: tokens, or: cost (needs a pricing: block, see below)
    #       every: 1min            # N{min,h,d,w,mo} — also: 5h, 2w, 3d
    #       amount: 60             # a short RPM-style gate (a rate limit, not the billing period)
    #
    #     - metric: requests
    #       every: 1mo             # the LONGEST window here -> this one is the bucket
    #       since: 2026-08-01      # period anchor; every subsequent period is
    #                              # derived automatically. Omit to anchor at the
    #                              # calendar boundary for the unit (midnight for
    #                              # min/h/d, Monday for w, the 1st for mo) so a
    #                              # hot-reload within a period keeps the count —
    #                              # accepted forms: YYYY-MM-DD, RFC3339, or a
    #                              # bare hh:mm[:ss] for min/h Limits only
    #       amount: 90000          # this window's cap, in vmr's own observed unit
    #
    #       # token_weights (P2.1): per-component scaling for a metric: tokens
    #       # Limit's base(tokens) sum — per-Limit since P3 (a provider's
    #       # several windows aren't guaranteed to share one ratio in
    #       # practice). Defaults to 1.0 on every component (a plain equal-
    #       # weighted total token count) when omitted entirely, or on any
    #       # component you don't mention — only meaningful (and only accepted
    #       # by config validation) on a Limit whose own metric is tokens.
    #       # Use this when the account's own Credits-style discount ratio
    #       # (e.g. cache reads cost a fraction of fresh input) is uniform
    #       # across all its models; if the ratio instead varies BY MODEL, use
    #       # metric: cost with a pricing: block instead (see plan-e/plan-f
    #       # below).
    #       # token_weights: {in_fresh: 1.0, cache_read: 0.1, cache_write: 1.25, out: 4.0}
    #
    #       # model_multipliers (P2.1): per-model scaling applied to EVERY
    #       # component of a charge (including requests), at the moment the
    #       # charge is recorded — not at read time. Also per-Limit since P3.
    #       # "*" is a wildcard fallback for any model not named explicitly;
    #       # a Limit with neither a named nor a "*" entry is unscaled (1.0).
    #       # Only affects metric: requests/tokens — a cost Limit gets its
    #       # price differentiation entirely from the pricing: block instead
    #       # (configuring both on the same Limit is a load-time error).
    #       # model_multipliers: {"*": 1.0, heavy-model: 9}
    #
    #       # models (Scope): decides BOTH which upstream models this Limit
    #       # applies to AND whether they share one pool or each get an
    #       # independent one. Omitted (the shape above) = every model on
    #       # this provider, one shared pool. Setting it at all — "*" or a
    #       # named list — switches to independent per-model accounting:
    #       #   models: ["*"]                 # every model, EACH with its own pool (e.g. a per-model RPM gate)
    #       #   models: [premium-model]        # only this model, its own pool; every other model is untouched by this Limit
    #       # "*" is a reserved token, not a glob — "gpt-*" matches nothing,
    #       # and combining "*" with a named entry is a load-time error (the
    #       # wildcard already covers it). /status shows one row per
    #       # model that has actually been charged, not one row per Limit.

  # A Credits-style account whose per-model price differs (not just a
  # uniform ratio, which token_weights above would cover) — metric: cost
  # (P2.2) charges it in real money, priced through the standard table plus
  # this account's own overrides. See docs/UserGuide.md's "Pricing and
  # cost-metric quota" section for the full write-up.
  # - name: anthropic              # naming the provider after its vendor helps the automatic model-name
  #                                 # resolution below find the standard table's matching entry
  #   base_url: {anthropic-messages: https://api.anthropic.com}
  #   api_key: ${ANTHROPIC_API_KEY}
  #   quota:
  #     limits:
  #       - {metric: cost, every: 1mo, since: 2026-08-01, amount: 500}  # 500 CNY/month
  #   pricing:
  #     map:                        # only needed when auto-resolution can't guess your model name —
  #       my-claude-alias: anthropic/claude-3-7-sonnet-20250219  # vmr's own model name -> standard table's canonical key
  #     overrides:                  # first-match-wins; each entry is EITHER discount OR all four
  #       # components (in_fresh/cache_read/cache_write/out), never a mix or a partial set.
  #       # List a specific model BEFORE a "*" wildcard fallback — the reverse order makes
  #       # the specific rule dead config (vmr rejects it at load time; no time-scoped
  #       # promo/off-peak windows here, only a static per-model rate).
  #       - {model: my-model-x, in_fresh: 1.58, cache_read: 0.32, cache_write: 1.58, out: 9.54}  # this account's actual negotiated rate, already in CNY (pricing.currency above)
  #       - {model: my-model-y, currency: USD, in_fresh: 1, cache_read: 0.1, cache_write: 1.25, out: 4}  # or: entered in the vendor's own USD invoice, converted via pricing.exchange_rate
  #       - {model: "*", discount: 0.6}  # fallback: 40% off list price for every other model on this account

  # A complete Scope example: account-wide shared pool STACKED with an
  # independent sub-cap for one specific model — a legitimate, common
  # combination, not a conflict (a shared Limit and a per-model Limit on
  # different windows never collide on the same bucket key; see the models:
  # comment further up for the general rule).
  # - name: plan-with-submodel-cap
  #   base_url: {openai-completions: https://api.example.com/v1}
  #   api_key: ${EXAMPLE_API_KEY}
  #   quota:
  #     limits:
  #       - {metric: requests, every: 1mo, amount: 50000}                       # every model on this provider, one shared pool
  #       - {metric: requests, every: 1d, amount: 200, models: [premium-model]} # ONLY premium-model, its own independent pool

  - name: openrouter
    # OpenRouter speaks all three surfaces on the same base — including a
    # (Beta, as of this writing) Responses-compatible endpoint, forced
    # stateless: store:true / a non-null previous_response_id gets a 400
    # from OpenRouter itself, vmr doesn't intercept it.
    base_url: {openai-completions: https://openrouter.ai/api/v1, anthropic-messages: https://openrouter.ai/api/v1, openai-responses: https://openrouter.ai/api/v1}
    api_key: ${OPENROUTER_API_KEY}
    # proxy: true                # per-provider switch: true = always go through
                                 # https_proxy/http_proxy above; absent/false = direct
                                 # (the default). No global default to inherit — every
                                 # provider decides its own proxy use, explicitly. No
                                 # env fallback; true with no matching proxy URL fails
                                 # validation — which is why this line stays commented
                                 # out here alongside https_proxy above: this file is
                                 # meant to pass `vmr check` as-is. Uncomment BOTH
                                 # together. YAML 1.2: write true/false, not on/off.

  - name: deepseek
    base_url: {openai-completions: https://api.deepseek.com/v1, anthropic-messages: https://api.deepseek.com/anthropic/v1}
    api_key: ${DEEPSEEK_API_KEY}

  # A second OpenRouter account — e.g. a team/backup key — kept here purely
  # to demonstrate the `providers: [...]` multi-account merge (see the
  # "agent" example below) and the top-level `fallback_endpoints:` block
  # above models: further down. A real deployment only needs a second
  # provider entry like this when it actually has two accounts on the same
  # vendor.
  - name: openrouter2
    base_url: {openai-completions: https://openrouter.ai/api/v1, anthropic-messages: https://openrouter.ai/api/v1, openai-responses: https://openrouter.ai/api/v1}
    api_key: ${OPENROUTER_API_KEY}   # a real second account would reference its own ${VAR} — reused
                                     # here only so this file keeps loading cleanly with one key set

  # The openrouter/openrouter2 pair above, written the short way: api_keys:
  # (a labeled mapping, not a list) expands one provider entry into as many
  # as it has keys — "openrouter" here would become "openrouter-main" /
  # "openrouter-backup", and every `providers: [openrouter]` reference
  # anywhere in this file (including fallback_endpoints:) would be rewritten
  # to match automatically. A provider sets api_key: or api_keys:, never
  # both. See docs/UserGuide.md's "Several keys on one vendor" section.
  # - name: openrouter
  #   base_url: {openai-completions: https://openrouter.ai/api/v1}
  #   api_keys:
  #     main: ${OPENROUTER_KEY_MAIN}
  #     backup: ${OPENROUTER_KEY_BACKUP}

  # A provider whose API doesn't accept all OpenAI roles can have it rewritten
  # per endpoint-group (models.<name>.endpoints[].role_map below) — a plain
  # old->new mapping applied to "role" values inside the top-level "messages"
  # array before the body is sent upstream. The canonical use case: some
  # providers (e.g. DashScope/Qianwen) reject the "developer" role OpenAI
  # introduced for o1/o3-series models — mapping it back to "system" makes
  # those clients work without any client-side change. role_map lives on the
  # endpoint-group rather than the provider: the same account can back several
  # virtual models with different upstream model families, and not all of
  # them necessarily need the same rewrite. Only the specific roles listed
  # are affected; every other byte of the request is preserved.
  # - name: dashscope
  #   base_url: {openai-completions: https://dashscope.aliyuncs.com/compatible-mode/v1}
  #   api_key: ${DASHSCOPE_PLAN_KEY}

models:
  coding:
    # strategy defaults to [priority] — priority is currently the only
    # dimension implemented, so this list has nothing else to name yet.
    # Endpoints below have no explicit priority — ties (everyone defaults
    # to 0) keep this file order, so listing them in the order you want
    # them tried is enough.
    #
    # capabilities/max_context_tokens (condition routing) and sticky_ttl
    # (Sticky Model) are all optional and default to "unconstrained" /
    # "inherit the global default" — omitting them, as every endpoint
    # below does, is identical to how this file behaved before these
    # fields existed. sticky itself (session affinity) defaults to true
    # per virtual model; see the "cheap" model below for the opt-out and
    # per-endpoint override forms. Full reference: docs/UserGuide.md
    # "Condition-based routing" / "Sticky Model".
    endpoints:
      - protocol: openai-completions
        providers: [openrouter]
        models: [z-ai/glm-5.2]
      - protocol: openai-completions
        providers: [deepseek]
        models: [deepseek-v4-pro]

  cheap:
    # image_downscale: 0        # per-model override example: force this model
                                 # to skip downscaling even if the global
                                 # setting above is on (omit to inherit it)
    # sticky: false              # opt out of session affinity for a model that's
                                  # genuinely one-shot (no multi-turn value to protect)
    # fallback: false             # opt this virtual model out of the fallback_endpoints:
                                  # block above entirely — for a model that must stay
                                  # strictly scoped to its own declared endpoints (omit to
                                  # inherit the default true, i.e. participate)
    # soft_block_failover: true   # let a 2xx that carries a vendor content-policy flag
                                  # (MiniMax input_sensitive/output_sensitive) but returns
                                  # an empty/near-empty answer fail over like an ErrContent
                                  # 4xx would, instead of reaching the client as a clean
                                  # empty 200. Non-streaming responses only; off by default.
                                  # Model-level here is the default for every endpoint below;
                                  # an endpoint can still override with its own value.
    endpoints:
      - protocol: openai-completions
        providers: [minimax]
        models: [MiniMax-M3]
        # capabilities: [image]        # this model has no base capabilities above, so this
        #                              # endpoint's effective set is exactly [image] alone
        # max_context_tokens: 1000000  # declare once you want vmr to skip this endpoint
        #                              # for requests it can't actually serve
        # soft_block_failover: false   # this one endpoint opts out even if the model turned it on
      - protocol: openai-completions
        providers: [openrouter]
        # A models: list with more than one name expands into that many
        # independent, individually health-tracked endpoints sharing this
        # entry's provider/protocol/capabilities/priority — tried in list
        # order (each still subject to its own failover/health state).
        models: [tencent/hy3-preview, qwen/qwen3-max]
      - protocol: openai-completions
        providers: [deepseek]
        models: [deepseek-v4-flash]
        # sticky_ttl: 2h   # DeepSeek's disk-based prompt cache lasts hours to days —
                            # override the global sticky_ttl for just this endpoint

  # "agent" mixes all three ingress protocols under one virtual model name:
  # the openai-completions entry is reachable only from POST /v1/chat/completions,
  # the anthropic-messages entry only from POST /v1/messages, the
  # openai-responses entry only from POST /v1/responses — a client on any of
  # the three can ask for "agent" and get its own independent try-order
  # list, sharing nothing but the name.
  #
  # capabilities/max_context_tokens here are the *base* every endpoint below
  # inherits: both backing models support at least text+tools up to 256k
  # tokens, so that's declared once instead of on each entry. The minimax
  # endpoint's own capabilities: [...] list ADDS to the base (union — its
  # effective set is text,tools,image,audio,video,thinking, not just the
  # four listed here) and its own max_context_tokens OVERRIDES the base to
  # 512000 for that endpoint alone; the openrouter entries declare neither,
  # so they simply inherit the base as-is.
  agent:
    capabilities: [text, tools]
    max_context_tokens: 256000
    endpoints:
      - protocol: openai-completions
        providers: [openrouter, openrouter2]   # multi-account merge: outer loop over models,
        models: [gemini-3.6-flash-high, gemini-3.1-pro-high]   # inner over providers — openrouter then
        #                                                       # openrouter2 for gemini-3.6-flash-high,
        #                                                       # then the same pair for gemini-3.1-pro-high
      - protocol: anthropic-messages
        providers: [minimax]
        models: [MiniMax-M3]
        max_context_tokens: 512000
        capabilities: [image, audio, video, thinking]
      - protocol: openai-responses
        providers: [openrouter]
        models: [gemini-3.6-flash-high]

  # Anthropic-only virtual model: reachable only via POST /v1/messages.
  # "claude" needs no openai-completions entry — nothing on the openai-completions side
  # references it, and a request for it over POST /v1/chat/completions
  # simply finds no route, since that ingress only ever looks at
  # protocol: openai-completions entries.
  claude:
    endpoints:
      - protocol: anthropic-messages
        providers: [minimax]
        models: [MiniMax-M3]
      - protocol: anthropic-messages
        providers: [deepseek]
        models: [deepseek-v4-pro]
      - protocol: anthropic-messages
        providers: [openrouter]
        models: [minimax/minimax-m3] # any OpenRouter model, spoken over anthropic-messages protocol
