# Ver 2026-07-13 02:00, by Fable 5
# vmr config — copy to config.yaml and adjust.
# providers = what you have; models = what clients see and in which order to use it.
# Both are nested protocol -> name: the outer key is the adapter/protocol
# ("openai" | "anthropic"), so a model's endpoints can only ever reference a
# provider from its own protocol group — mixing protocols in one model has no
# syntax to write, rather than being a config error to catch.

listen: 127.0.0.1:8800
# api_key: sk-vmr-local-xxx      # optional: protect the router itself (Bearer)
# max_attempts: 0                # cap on upstream tries; default 0 = walk every available endpoint
# max_request_body_mb: 8         # inbound request body size cap (stability, unrelated to audit logging)
# max_concurrency: 8             # global gate; excess requests wait in memory (0/absent = unlimited)
# https_proxy: http://127.0.0.1:7890   # upstream proxy for https base_urls — the ONLY way vmr uses a proxy (env vars are
#                                      # ignored; write ${HTTPS_PROXY} to reference one explicitly); a provider's own
#                                      # `proxy: false` always wins; unset = every provider connects directly
# http_proxy: http://127.0.0.1:7890    # same, for http base_urls (e.g. a LAN llama.cpp server)
# image_downscale: 512           # shrink inline request images to this many px on the long side (0/absent = off); a model's own image_downscale below overrides this
# image_cache_ttl_days: 7        # evict downscale-cache entries unused for this many days (0/absent = default 7)
# audit_retention_days: 30       # delete audit files older than this; 0/absent = keep forever (rotation always compresses old days to .zst regardless)
# log_dir: ~/.vmr/logs           # audit JSONL directory; used exactly as given (~/ expands); absent = ~/.vmr/logs. Changing it needs a restart
# image_cache_dir: ~/.vmr/image_cache  # downscale-result cache directory; same rule; absent = ~/.vmr/image_cache; follows hot reload
# timeouts:
#   connect: 10s
#   response_header: 120s        # time to first byte from upstream
#   stream_idle: 120s            # abort any upstream body (stream, JSON, error) silent for this long

providers:
  openai:
    minimax:
      base_url: https://api.minimaxi.com/v1
      api_key: ${MINIMAX_PLAN_KEY}
      # proxy: false               # per-provider switch: false = always connect
      #                            # directly, whatever https_proxy says (typical
      #                            # for domestic providers when the proxy only
      #                            # exists for the foreign ones); true/absent =
      #                            # follow https_proxy above. No env fallback;
      #                            # true without a global proxy fails validation.
      #                            # YAML 1.2: write true/false, not on/off.
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key: ${DEEPSEEK_API_KEY}
  # Anthropic-protocol providers: callers use POST /v1/messages. Same short
  # names as above are reused on purpose — nesting by protocol means
  # "openrouter" here and "openrouter" under providers.openai are two
  # unambiguous, independent entries (same account, different API surface).
  anthropic:
    minimax:
      base_url: https://api.minimaxi.com/anthropic/v1
      api_key: ${MINIMAX_PLAN_KEY}
    deepseek:
      base_url: https://api.deepseek.com/anthropic/v1
      api_key: ${DEEPSEEK_API_KEY}
    openrouter: # OpenRouter also speaks Anthropic; same base, /messages appended
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}

models:
  openai:
    coding:
      # strategy defaults to [priority]; endpoints below have no explicit
      # priority — ties (everyone defaults to 0) keep this file order, so
      # listing them in the order you want them tried is enough.
      endpoints:
        - {provider: openrouter, model: z-ai/glm-5.2}
        - {provider: deepseek, model: deepseek-v4-pro}

    cheap:
      # image_downscale: 0        # per-model override example: force this model
                                   # to skip downscaling even if the global
                                   # setting above is on (omit to inherit it)
      endpoints:
        - {provider: minimax, model: MiniMax-M3}
        - {provider: openrouter, model: tencent/hy3-preview}
        - {provider: deepseek, model: deepseek-v4-flash}

  # Anthropic-protocol virtual models: reachable only via POST /v1/messages.
  # "claude" only needs to exist here; nothing under models.openai references
  # it, and models.openai.coding above can't accidentally reach these
  # providers even by typo, since anthropic.* isn't in its lookup scope.
  anthropic:
    claude:
      endpoints:
        - {provider: minimax, model: MiniMax-M3}
        - {provider: deepseek, model: deepseek-v4-pro}
        - {provider: openrouter, model: minimax/minimax-m3} # any OpenRouter model, spoken over Anthropic protocol
