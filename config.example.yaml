# Ver 2026-07-07 02:15, by Fable 5
# vmr config — copy to config.yaml and adjust.
# providers = what you have; models = what clients see and in which order to use it.

listen: 127.0.0.1:8800
# api_key: sk-vmr-local-xxx      # optional: protect the router itself (Bearer)
# max_attempts: 0                # cap on upstream tries; default 0 = walk every available endpoint
# max_body_mb: 8                 # request body buffer limit
# max_concurrency: 8             # global gate; excess requests wait in memory (0/absent = unlimited)
# timeouts:
#   connect: 10s
#   response_header: 120s        # time to first byte from upstream
#   stream_idle: 120s            # abort a stream silent for this long

providers:
  minimax:
    type: openai # adapter type; MiniMax is OpenAI-compatible
    base_url: https://api.minimaxi.com/v1
    api_key: ${MINIMAX_PLAN_KEY}
  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  # Anthropic-protocol providers: callers use POST /v1/messages.
  # VMR never converts protocols — a model's endpoints must all share one protocol.
  minimax_a:
    type: anthropic
    base_url: https://api.minimaxi.com/anthropic/v1
    api_key: ${MINIMAX_PLAN_KEY}
  deepseek_a:
    type: anthropic
    base_url: https://api.deepseek.com/anthropic/v1
    api_key: ${DEEPSEEK_API_KEY}
  openrouter_a: # OpenRouter also speaks Anthropic; same base, /messages appended
    type: anthropic
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}

models:
  coding:
    strategy: [priority] # MVP dimension; ties keep file order
    endpoints:
      - provider: openrouter
        model: z-ai/glm-5.2
        priority: 2
      - provider: deepseek
        model: deepseek-v4-pro
        priority: 3

  cheap:
    endpoints: # strategy defaults to [priority]
      - provider: minimax
        model: MiniMax-M3
        priority: 1
      - provider: openrouter
        model: tencent/hy3-preview
        priority: 2
      - provider: deepseek
        model: deepseek-v4-flash
        priority: 3

  # Anthropic-protocol virtual model: reachable only via POST /v1/messages.
  claude:
    endpoints:
      - provider: minimax_a
        model: MiniMax-M3
        priority: 1
      - provider: deepseek_a
        model: deepseek-v4-pro
        priority: 2
      - provider: openrouter_a # any OpenRouter model, spoken over Anthropic protocol
        model: minimax/minimax-m3
        priority: 3
